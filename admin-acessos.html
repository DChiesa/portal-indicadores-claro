<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log de acessos</title><script src="./portal-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>
:root{--red:#e30613;--blue:#17466f;--ink:#172033;--muted:#667085}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f3f5f8;color:var(--ink)}header{background:linear-gradient(100deg,#980009,var(--red));color:#fff;padding:22px;display:flex;align-items:center;gap:14px}header h1{margin:0;font-size:24px}header button{margin-left:auto;border:0;border-radius:9px;padding:10px 13px;font-weight:800}.wrap{max-width:1200px;margin:auto;padding:20px}.filters,.cards,.panel{background:#fff;border:1px solid #d7deea;border-radius:15px;padding:16px;margin-bottom:15px}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.filters label{font-size:12px;font-weight:800}.filters select,.filters input,.filters button{height:38px;border:1px solid #cbd2dc;border-radius:8px;padding:0 10px}.filters button{background:var(--blue);color:#fff;font-weight:800}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kpi{padding:14px;background:#f5f8fc;border-radius:12px}.kpi b{display:block;font-size:25px;color:var(--blue)}canvas{width:100%;height:280px;border-bottom:1px solid #ddd}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;font-size:13px}th{background:#f7f8fa}.err{color:#b42318;font-weight:800}@media(max-width:700px){.cards{grid-template-columns:1fr}header h1{font-size:19px}}</style></head><body><header><h1>Administração • Log de acessos</h1><button onclick="location.href='index.html'">← Voltar</button></header><main class="wrap"><div id="msg">Carregando...</div><section id="app" hidden><div class="filters"><label>Período<br><select id="periodo"><option value="day">Diário</option><option value="week">Semanal</option><option value="month">Mensal</option></select></label><label>De<br><input id="inicio" type="date"></label><label>Até<br><input id="fim" type="date"></label><button id="aplicar">Aplicar</button></div><div class="cards"><div class="kpi">Acessos no período<b id="total">0</b></div><div class="kpi">Usuários únicos<b id="usuarios">0</b></div><div class="kpi">Dias com acesso<b id="dias">0</b></div></div><div class="panel"><canvas id="grafico" width="1100" height="280"></canvas></div><div class="panel tablewrap"><table><thead><tr><th>Período</th><th>Email ou login</th><th>Quantidade</th></tr></thead><tbody id="linhas"></tbody></table></div></section></main><script>
'use strict';const A=['demetrius377','demetrius377@claro.com.br','demetrius377@gmail.com'];const n=v=>String(v||'').toLowerCase();const sb=supabase.createClient(PORTAL_CONFIG.SUPABASE_URL,PORTAL_CONFIG.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const $=x=>document.getElementById(x);function iso(d){return d.toISOString().slice(0,10)}function padrao(){const f=new Date(),i=new Date();i.setDate(f.getDate()-29);$('inicio').value=iso(i);$('fim').value=iso(f)}async function carregar(){const s=(await sb.auth.getSession()).data.session;if(!s){location.href='index.html';return}if(!A.some(x=>n(s.user.email).includes(n(x)))){$('msg').className='err';$('msg').textContent='Acesso restrito ao administrador.';return}$('app').hidden=false;$('msg').textContent='';const r=await sb.rpc('portal_admin_resumo_acessos',{p_inicio:$('inicio').value,p_fim:$('fim').value,p_periodo:$('periodo').value});if(r.error){$('msg').className='err';$('msg').textContent='Erro: '+r.error.message;return}const rows=r.data||[];$('total').textContent=rows.reduce((a,x)=>a+Number(x.quantidade||0),0);$('usuarios').textContent=new Set(rows.map(x=>x.login)).size;$('dias').textContent=new Set(rows.map(x=>x.periodo)).size;$('linhas').innerHTML=rows.map(x=>`<tr><td>${x.periodo}</td><td>${esc(x.login)}</td><td>${x.quantidade}</td></tr>`).join('');grafico(rows)}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function grafico(rows){const c=$('grafico'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);const agg={};rows.forEach(r=>agg[r.periodo]=(agg[r.periodo]||0)+Number(r.quantidade||0));const a=Object.entries(agg).sort(),max=Math.max(1,...a.map(z=>z[1])),m=45,w=Math.max(12,(c.width-m*2)/Math.max(1,a.length)-8);x.strokeStyle='#9ca3af';x.beginPath();x.moveTo(m,15);x.lineTo(m,c.height-35);x.lineTo(c.width-10,c.height-35);x.stroke();a.forEach((z,i)=>{const h=(c.height-65)*z[1]/max,px=m+10+i*(w+8),py=c.height-35-h;x.fillStyle='#17466f';x.fillRect(px,py,w,h);x.fillStyle='#172033';x.font='11px Segoe UI';x.fillText(String(z[1]),px,py-4);x.save();x.translate(px+5,c.height-20);x.rotate(-.55);x.fillText(z[0],0,0);x.restore()})}padrao();$('aplicar').onclick=carregar;carregar();</script></body></html>
