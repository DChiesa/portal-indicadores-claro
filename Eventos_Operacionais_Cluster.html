<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventos Operacionais Cluster</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>:root{--r:#e30613;--d:#252525;--g:#f3f4f6;--b:#fff;--l:#e1e3e6}*{box-sizing:border-box}body{margin:0;background:var(--g);font:14px Arial;color:var(--d)}header{height:170px;background:#b00009 url('banner-eventos-operacionais-cluster.png') center/cover no-repeat}.wrap{max-width:1580px;margin:auto;padding:18px}.toolbar,.panel,.card{background:#fff;border:1px solid var(--l);border-radius:14px;box-shadow:0 7px 22px #00000012}.toolbar{display:grid;grid-template-columns:repeat(5,1fr) auto;gap:12px;padding:15px}.f label{display:block;color:#a00008;font-size:12px;font-weight:bold;margin-bottom:6px}.f select{width:100%;height:40px;border:1px solid #cfd2d6;border-radius:8px;padding:0 9px}.btn{height:40px;border:0;border-radius:8px;padding:0 17px;background:var(--r);color:#fff;font-weight:bold;cursor:pointer}.status{margin:0 0 12px;font-weight:bold}.tabs{display:flex;gap:7px;overflow:auto;margin:16px 0}.tab{border:0;background:#fff;padding:11px 16px;border-radius:9px;font-weight:bold;white-space:nowrap;cursor:pointer}.tab.active{background:var(--r);color:#fff}.view{display:none}.view.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{padding:16px}.card b{display:block}.card strong{display:block;color:var(--r);font-size:33px;margin:8px 0}.card small{color:#666}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:15px;margin-top:15px}.panel{padding:17px;min-width:0}.panel h2{margin:0 0 5px}.sub{color:#6b6f75;margin:0 0 13px}.chart{height:390px;position:relative}.scroll{overflow:auto;max-height:620px;border:1px solid var(--l);border-radius:9px}table{width:100%;border-collapse:collapse;min-width:850px}th{position:sticky;top:0;background:#c90d18;color:#fff}th,td{padding:10px;border-bottom:1px solid var(--l);text-align:center}th:first-child,td:first-child{text-align:left}.note{background:#fff1f2;border-left:5px solid var(--r);padding:12px;margin-top:12px;border-radius:7px}@media(max-width:950px){header{height:120px}.toolbar{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:560px){.toolbar,.cards{grid-template-columns:1fr}header{height:90px}}</style></head><body>
<!-- PONTO_APROVADO: estrutura funcional anterior preservada --><!-- ALTERAÇÃO: nome do arquivo, título e banner para Eventos Operacionais Cluster -->
<header aria-label="Eventos Operacionais Cluster"></header><main class="wrap"><div id="status" class="status">Carregando Eventos Operacionais Cluster...</div>
<section class="toolbar"><div class="f"><label>Dia</label><select id="day"></select></div><div class="f"><label>Cidade</label><select id="city"></select></div><div class="f"><label>Categoria</label><select id="cat"></select></div><div class="f"><label>Hora</label><select id="hour"></select></div><div class="f"><label>Comparar com</label><select id="compare"></select></div><button id="export" class="btn">Exportar visão</button></section>
<nav class="tabs"><button class="tab active" data-v="main">Principal</button><button class="tab" data-v="history">Histórico</button><button class="tab" data-v="table">Tabela de dados</button><button class="tab" data-v="graphs">Gráficos</button><button class="tab" data-v="categories">Categorias</button><button class="tab" data-v="evolution">Evolução / comparação</button></nav>
<section id="main" class="view active"><div id="cards" class="cards"></div><div class="grid"><article class="panel"><h2>Detalhamento por cidade</h2><p class="sub">Eventos no horário selecionado.</p><div class="scroll"><table id="cityTable"></table></div></article><article class="panel"><h2>Eventos por categoria</h2><div class="chart"><canvas id="mainChart"></canvas></div></article></div></section>
<section id="history" class="view"><article class="panel"><h2>Histórico diário</h2><p class="sub">Último horário preenchido em cada aba.</p><div class="chart"><canvas id="historyChart"></canvas></div></article></section>
<section id="table" class="view"><article class="panel"><h2>Tabela de dados</h2><div class="scroll"><table id="dataTable"></table></div></article></section>
<section id="graphs" class="view"><div class="grid"><article class="panel"><h2>Por cidade</h2><div class="chart"><canvas id="cityChart"></canvas></div></article><article class="panel"><h2>Por categoria</h2><div class="chart"><canvas id="catChart"></canvas></div></article></div></section>
<section id="categories" class="view"><article class="panel"><h2>Evolução por categoria</h2><div class="chart"><canvas id="catEvolution"></canvas></div></article></section>
<section id="evolution" class="view"><div class="grid"><article class="panel"><h2>Evolução horária</h2><div class="chart"><canvas id="evoChart"></canvas></div></article><article class="panel"><h2>Comparação entre dias</h2><div class="chart"><canvas id="comparisonChart"></canvas></div><div id="comparisonText" class="note"></div></article></div></section></main>
<script>'use strict';const C={url:'https://frxfoztyctrvsobbawmo.supabase.co',key:'sb_publishable_or6yc7T71Hpyajn9ctn1FA_BjsB6LhL',bucket:'bases-tecnico',excel:'atual/Eventos.xlsx'},COL=['#e30613','#9d0008','#ff606a','#f59e0b','#222','#73777d','#d26b72','#506d86'];let DB={},CH={};const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),num=x=>{let n=Number(String(x??'').replace(',','.'));return Number.isFinite(n)?n:null};function dt(n){let p=n.match(/(\d{1,2})\D+(\d{1,2})\D+(\d{2,4})/);if(!p)return null;let y=+p[3];if(y<100)y+=2000;return new Date(y,+p[2]-1,+p[1],12)}function br(d){return d?d.toLocaleDateString('pt-BR'):'Sem data'}function hours(r){return[...new Set(r.flatMap(x=>Object.keys(x.v)))].sort((a,b)=>parseFloat(a)-parseFloat(b))}function latest(r){let h=hours(r);for(let i=h.length-1;i>=0;i--)if(r.some(x=>x.v[h[i]]!==null))return h[i];return h[0]}function sum(r,h){return r.reduce((a,x)=>a+(x.v[h]??0),0)}function rows(d){let x=DB[d]?.r||[];return x.filter(r=>($('city').value==='TODAS'||r.city===$('city').value)&&($('cat').value==='TODAS'||r.cat===$('cat').value))}function options(el,a,label,sel){el.innerHTML=a.map(x=>`<option value="${esc(x)}" ${x===sel?'selected':''}>${esc(label(x))}</option>`).join('')}function prev(){let d=$('day').value;if($('compare').value!=='AUTO'&&$('compare').value!==d)return $('compare').value;let a=Object.keys(DB).filter(x=>DB[x].r.some(r=>Object.values(r.v).some(v=>v!==null))).sort((x,y)=>DB[x].date-DB[y].date);return a[a.indexOf(d)-1]||null}function chart(id,type,labels,datasets,opt={}){CH[id]?.destroy();CH[id]=new Chart($(id),{type,data:{labels,datasets},plugins:[ChartDataLabels],options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:20,right:15}},plugins:{legend:{position:'bottom'},datalabels:{anchor:'end',align:'top',clamp:true,font:{weight:'bold'},formatter:v=>v===null?'':v}},scales:type==='doughnut'?{}:{y:{beginAtZero:true,grace:'15%',ticks:{precision:0}},x:{grid:{display:false}}},...opt}})}async function load(){try{let s=supabase.createClient(C.url,C.key),{data,error}=await s.storage.from(C.bucket).download(C.excel);if(error)throw error;parse(XLSX.read(await data.arrayBuffer(),{type:'array'}));$('status').textContent='Fonte: Supabase Storage • '+C.bucket+'/'+C.excel}catch(e){$('status').textContent='Erro ao carregar a base: '+(e.message||e)}}function parse(w){DB={};w.SheetNames.forEach(n=>{let m=XLSX.utils.sheet_to_json(w.Sheets[n],{header:1,defval:null,raw:true}),i=m.findIndex(r=>r.some(c=>String(c??'').trim().toLowerCase()==='categoria'));if(i<0)return;let hd=m[i].map(x=>String(x??'').trim()),cat='',r=[];m.slice(i+1).forEach(x=>{if(String(x[0]??'').trim())cat=String(x[0]).trim();let city=String(x[1]??'').trim();if(!cat||!city)return;let v={};hd.slice(2).forEach((h,j)=>{if(h)v[h]=num(x[j+2])});r.push({cat,city,v})});DB[n]={date:dt(n),r}});init()}function init(){let d=Object.keys(DB).filter(x=>DB[x].r.some(r=>Object.values(r.v).some(v=>v!==null))).sort((a,b)=>DB[a].date-DB[b].date),now=new Date(),today=d.find(x=>{let z=DB[x].date;return z&&z.toDateString()===now.toDateString()})||d.at(-1),all=Object.values(DB).flatMap(x=>x.r);options($('day'),d,x=>br(DB[x].date),today);options($('compare'),['AUTO',...d],x=>x==='AUTO'?'Dia anterior disponível':br(DB[x].date),'AUTO');options($('city'),['TODAS',...new Set(all.map(x=>x.city))],x=>x==='TODAS'?'Todas':x,'TODAS');options($('cat'),['TODAS',...new Set(all.map(x=>x.cat))],x=>x==='TODAS'?'Todas':x,'TODAS');setHours();render()}function setHours(){let r=DB[$('day').value].r,h=hours(r);options($('hour'),h,x=>x,latest(r))}function render(){let d=$('day').value,h=$('hour').value,r=rows(d),cats=[...new Set(r.map(x=>x.cat))],cities=[...new Set(r.map(x=>x.city))],p=prev(),pr=p?rows(p):[];$('cards').innerHTML=cats.map(c=>{let v=sum(r.filter(x=>x.cat===c),h),old=p?sum(pr.filter(x=>x.cat===c),h):null,dd=old===null?'Sem base anterior':`${v-old>0?'+':''}${v-old}`;return`<article class="card"><b>${esc(c)}</b><strong>${v}</strong><small>${esc(h)} • comparativo ${dd}</small></article>`}).join('');$('cityTable').innerHTML='<thead><tr><th>Cidade</th>'+cats.map(c=>`<th>${esc(c)}</th>`).join('')+'<th>Total</th></tr></thead><tbody>'+cities.map(c=>{let v=cats.map(k=>sum(r.filter(x=>x.city===c&&x.cat===k),h));return`<tr><td>${esc(c)}</td>${v.map(n=>`<td>${n}</td>`).join('')}<td><b>${v.reduce((a,b)=>a+b,0)}</b></td></tr>`}).join('')+'</tbody>';chart('mainChart','bar',cats,[{label:h,data:cats.map(c=>sum(r.filter(x=>x.cat===c),h)),backgroundColor:COL}],{indexAxis:'y',plugins:{legend:{display:false},datalabels:{anchor:'end',align:'right'}}});let ds=Object.keys(DB).filter(x=>DB[x].r.length).sort((a,b)=>DB[a].date-DB[b].date);chart('historyChart','line',ds.map(x=>br(DB[x].date)),cats.map((c,i)=>({label:c,data:ds.map(x=>{let z=rows(x).filter(q=>q.cat===c),hh=latest(z);return hh?sum(z,hh):0}),borderColor:COL[i%COL.length],backgroundColor:COL[i%COL.length]})));let hs=hours(DB[d].r);$('dataTable').innerHTML='<thead><tr><th>Categoria</th><th>Cidade</th>'+hs.map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>'+r.map(x=>`<tr><td>${esc(x.cat)}</td><td>${esc(x.city)}</td>${hs.map(q=>`<td>${x.v[q]??''}</td>`).join('')}</tr>`).join('')+'</tbody>';chart('cityChart','bar',cities,[{label:h,data:cities.map(c=>sum(r.filter(x=>x.city===c),h)),backgroundColor:COL}]);chart('catChart','doughnut',cats,[{data:cats.map(c=>sum(r.filter(x=>x.cat===c),h)),backgroundColor:COL}]);let lines=cats.map((c,i)=>({label:c,data:hs.map(q=>sum(r.filter(x=>x.cat===c),q)),borderColor:COL[i%COL.length],backgroundColor:COL[i%COL.length]}));chart('catEvolution','line',hs,lines);chart('evoChart','line',hs,lines);let cur=sum(r,h),old=p?sum(pr,h):null;chart('comparisonChart','bar',p?[br(DB[p].date),br(DB[d].date)]:[br(DB[d].date)],[{label:'Total '+h,data:p?[old,cur]:[cur],backgroundColor:['#777','#e30613']}]);$('comparisonText').textContent=p?`${br(DB[d].date)}: ${cur} às ${h}. ${br(DB[p].date)}: ${old} no mesmo horário. Diferença: ${cur-old}.`:'Não existe dia anterior preenchido para comparação.';}['day','city','cat','hour','compare'].forEach(id=>$(id).addEventListener('change',()=>{if(id==='day')setHours();render()}));$('export').onclick=()=>{let d=$('day').value,r=rows(d),hs=hours(DB[d].r),out=r.map(x=>({Dia:br(DB[d].date),Categoria:x.cat,Cidade:x.city,...Object.fromEntries(hs.map(h=>[h,x.v[h]]))})),w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(out),'Visao');XLSX.writeFile(w,'Eventos Operacionais Cluster.xlsx')};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.v).classList.add('active');Object.values(CH).forEach(c=>c.resize())});load();</script></body></html>
