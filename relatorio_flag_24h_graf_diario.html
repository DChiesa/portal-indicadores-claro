<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerar FLAG sem card % Alcançado</title>
<style>body{font-family:Segoe UI,Arial,sans-serif;background:#f4f6fa;color:#1f2937;margin:0;padding:32px}.box{max-width:760px;margin:auto;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:26px;box-shadow:0 14px 34px #0001}h1{color:#c71918;margin-top:0}label{display:block;font-weight:800;margin:18px 0 8px}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px}input{border:1px solid #cbd5e1}button{margin-top:16px;border:0;background:#c71918;color:#fff;font-weight:900;cursor:pointer}.msg{margin-top:16px;padding:12px;border-radius:10px;background:#f3f4f6;white-space:pre-wrap}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}</style></head>
<body><main class="box"><h1>Correção isolada do Relatório FLAG 24H</h1><p>Selecione o HTML atual. Será gerada uma cópia com apenas o card <b>% Alcançado</b> removido e os cinco cards restantes distribuídos igualmente.</p><label for="file">Arquivo relatorio_flag_24h_Graf_diario.html</label><input id="file" type="file" accept=".html,text/html"><button id="go">Gerar arquivo corrigido</button><div id="msg" class="msg">Nenhum arquivo selecionado.</div></main>
<script>
const msg=document.getElementById('msg');
function fail(t){msg.className='msg err';msg.textContent=t}
function ok(t){msg.className='msg ok';msg.textContent=t}
document.getElementById('go').onclick=async()=>{
 const file=document.getElementById('file').files[0]; if(!file)return fail('Selecione o arquivo HTML atual.');
 let s=await file.text(), original=s;
 const card=/<div class=["']kpi["'] id=["']kpiAchievedCard["']>\s*<div class=["']l["']>%\s*Alcançado<\/div>\s*<div class=["']v["'] id=["']kpiAchieved["']>[^<]*<\/div>\s*<div class=["']s["']>100\s*-\s*\(fora\s*\/\s*total SLA\)<\/div>\s*<\/div>/i;
 if(!card.test(s))return fail('Não encontrei o bloco exato do card % Alcançado. Nenhum arquivo foi alterado.');
 s=s.replace(card,'');
 const a=/\$\(["']kpiAchieved["']\)\.textContent\s*=\s*pct1\(m\.ach\);?/g;
 const b=/\$\(["']kpiAchievedCard["']\)\.className\s*=\s*["']kpi ["']\s*\+\s*\(m\.ach\s*>=\s*META\s*\?\s*["']ok["']\s*:\s*["']["']\);?/g;
 s=s.replace(a,'').replace(b,'');
 const grid=/\.kpis\{display:grid;grid-template-columns:repeat\(6,1fr\);/;
 if(!grid.test(s))return fail('O card foi localizado, mas não encontrei a grade original de 6 colunas. Nenhum download foi gerado.');
 s=s.replace(grid,'.kpis{display:grid;grid-template-columns:repeat(5,1fr);');
 if(s.includes('id="kpiAchievedCard"')||s.includes("id='kpiAchievedCard'")||s.includes("$('kpiAchieved')")||s.includes('$("kpiAchieved")'))return fail('A validação detectou referência restante ao card. Nenhum download foi gerado.');
 if(original===s)return fail('Nenhuma alteração foi realizada.');
 const blob=new Blob([s],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');
 link.href=url;link.download='relatorio_flag_24h_Graf_diario.html';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 ok('Arquivo gerado. Alterações aplicadas: card removido, 2 referências JavaScript removidas e grade alterada de 6 para 5 colunas. Todo o restante foi preservado.');
};
</script></body></html>
