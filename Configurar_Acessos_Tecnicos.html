<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurar Acessos Técnicos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--r:#c80000;--g:#128f51;--bg:#f4f6fa;--ink:#17243a}*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,var(--r),#960000);color:#fff;padding:17px}header div{max-width:1200px;margin:auto;display:flex;align-items:center;gap:12px}main{max-width:1200px;margin:20px auto;padding:0 14px}.card{background:#fff;border:1px solid #dde4ee;border-radius:17px;padding:17px;box-shadow:0 8px 25px #20334d12;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.full{grid-column:1/-1}label{display:block;font-size:11px;font-weight:800;color:#657386;margin-bottom:5px}input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}button{border:0;border-radius:10px;padding:11px 15px;background:var(--r);color:#fff;font-weight:800;cursor:pointer}.secondary{background:#edf1f7;color:var(--ink)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.msg{margin-top:12px;padding:10px;border-radius:8px;background:#e9f8ef;color:#086b37}.err{background:#ffe7e7;color:#940000}.list{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e4e9f0}th{font-size:11px;color:#657386}.pill{padding:4px 8px;border-radius:99px;background:#e9f8ef;color:#08753c;font-size:11px}.off{background:#fee9e9;color:#9f0000}.hide{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}header h1{font-size:18px}}</style></head><body><header><div><div style="border:2px solid;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;font-weight:900">claro</div><div><h1 style="margin:0">Configurar Acessos Técnicos</h1><small>Vincular Authentication, login, cidade e seção</small></div><button id="sair" style="margin-left:auto;background:#ffffff22;border:1px solid #ffffff66">Sair</button></div></header><main><section id="loginBox" class="card"><h2>Acesso administrativo</h2><div class="grid"><div><label>E-MAIL</label><input id="email" type="email"></div><div><label>SENHA</label><input id="senha" type="password"></div><div class="full"><button id="entrar">Entrar</button></div></div><div id="loginMsg"></div></section><section id="admin" class="hide"><div class="card"><div class="row"><div><h2 style="margin:0">Atribuir acesso</h2><p style="margin:4px 0;color:#657386">O usuário precisa existir primeiro em Authentication → Users.</p></div><button id="atualizar" class="secondary" style="margin-left:auto">Atualizar usuários</button></div><div class="grid"><div class="full"><label>USUÁRIO DO AUTHENTICATION</label><select id="usuario"></select></div><div><label>LOGIN TÉCNICO</label><input id="loginTecnico" placeholder="Ex.: Z449543"></div><div><label>NOME DO TÉCNICO</label><input id="nome" placeholder="Ex.: ROQUE"></div><div><label>CIDADE</label><select id="cidade"><option>BAGÉ</option><option>PELOTAS</option><option>RIO GRANDE</option></select></div><div><label>SEÇÃO</label><select id="secao"><option value="tecnico">Técnico</option><option value="administracao">Administração</option><option value="manutencao">Manutenção</option><option value="instalacao">Instalação</option><option value="rede">Rede</option><option value="headend">Headend</option><option value="backbone">Backbone</option><option value="filtro">Filtro</option></select></div><div><label>PERFIL</label><select id="role"><option value="tecnico">Técnico</option><option value="admin">Administrador</option></select></div><div><label>STATUS</label><select id="ativo"><option value="true">Ativo</option><option value="false">Inativo</option></select></div><div class="full"><button id="salvar">Salvar atribuição</button></div></div><div id="msg"></div></div><div class="card list"><h2>Acessos atribuídos</h2><table><thead><tr><th>E-mail</th><th>Login</th><th>Técnico</th><th>Cidade</th><th>Seção</th><th>Perfil</th><th>Status</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></section></main><script>const URL='https://frxfoztyctrvsobbawmo.supabase.co',KEY='sb_publishable_or6yc7T71Hpyajn9ctn1FA_BjsB6LhLim',sb=supabase.createClient(URL,KEY),$=x=>document.getElementById(x);let users=[];function note(t,e=false){$('msg').className='msg '+(e?'err':'');$('msg').textContent=t}async function auth(){let{data}=await sb.auth.getSession();if(data.session)openAdmin()}async function openAdmin(){$('loginBox').classList.add('hide');$('admin').classList.remove('hide');try{await load()}catch(e){note(e.message,true)}}async function load(){let{data:us,error}=await sb.rpc('admin_listar_usuarios_auth');if(error)throw error;users=us||[];$('usuario').innerHTML='<option value="">Selecione...</option>'+users.map(u=>`<option value="${u.email}">${u.email}</option>`).join('');let{data:p,error:pe}=await sb.from('perfis_tecnicos').select('*').order('nome_tecnico');if(pe)throw pe;$('tbody').innerHTML=(p||[]).map(x=>`<tr><td>${x.email}</td><td>${x.login_tecnico}</td><td>${x.nome_tecnico}</td><td>${x.cidade}</td><td>${x.secao}</td><td>${x.role}</td><td><span class="pill ${x.ativo?'':'off'}">${x.ativo?'Ativo':'Inativo'}</span></td><td><button class="secondary" onclick='edit(${JSON.stringify(x)})'>Editar</button></td></tr>`).join('')}window.edit=x=>{$('usuario').value=x.email;$('loginTecnico').value=x.login_tecnico;$('nome').value=x.nome_tecnico;$('cidade').value=x.cidade;$('secao').value=x.secao;$('role').value=x.role;$('ativo').value=String(x.ativo);scrollTo({top:0,behavior:'smooth'})};$('entrar').onclick=async()=>{let{error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('senha').value});if(error){$('loginMsg').className='msg err';$('loginMsg').textContent=error.message}else openAdmin()};$('salvar').onclick=async()=>{try{let p={p_email:$('usuario').value,p_login_tecnico:$('loginTecnico').value,p_nome_tecnico:$('nome').value,p_cidade:$('cidade').value,p_secao:$('secao').value,p_ativo:$('ativo').value==='true',p_role:$('role').value};if(!p.p_email||!p.p_login_tecnico||!p.p_nome_tecnico)throw Error('Preencha usuário, login e nome.');let{error}=await sb.rpc('admin_salvar_perfil',p);if(error)throw error;note('Acesso salvo com sucesso.');await load()}catch(e){note(e.message,true)}};$('atualizar').onclick=load;$('sair').onclick=async()=>{await sb.auth.signOut();location.reload()};auth();</script></body></html>
