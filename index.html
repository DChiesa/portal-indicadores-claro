<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal de Indicadores Claro</title><script src="./portal-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--r:#e30613;--ink:#172033;--muted:#667085}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}button,input{font:inherit}.hidden{display:none!important}#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#a9000c,#ed0012);padding:18px}.loginCard{width:min(430px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 24px 60px #5a000655}.brand{display:flex;gap:13px;align-items:center}.logo{width:58px;height:58px;display:grid;place-items:center;border-radius:17px;background:var(--r);color:#fff;font-weight:900}.brand h1{margin:0;color:var(--r);font-size:25px}.brand p{margin:4px 0;color:var(--muted)}label{display:block;margin:13px 0 6px;font-size:13px;font-weight:750}input{width:100%;padding:14px;border:1px solid #cad2dc;border-radius:12px;background:#edf4ff}.enter{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--r);color:#fff;font-weight:900}.msg{min-height:20px;margin-top:10px;color:#b00020;font-size:12px}.owner{margin-top:15px;padding-top:14px;border-top:1px solid #e3e8ef;text-align:center;color:#777;font-size:12px}#portal{min-height:100vh;background:linear-gradient(#03091bc9,#03091bd9),url('./assets/fundo-portal.jpg') center/cover fixed}.top{display:flex;align-items:center;gap:14px;padding:16px 22px;background:linear-gradient(100deg,#a6000d,#e30613);color:#fff;box-shadow:0 5px 20px #0007}.top .logo{width:48px;height:48px;border:1px solid #ffffff66}.top h2{margin:0}.top p{margin:3px 0 0;opacity:.86}.spacer{flex:1}.logout,.back,.newtab{border:0;border-radius:11px;padding:10px 13px;font-weight:850;cursor:pointer}.logout{background:#fff;color:var(--r)}.content{max-width:1440px;margin:auto;padding:28px 22px 50px}.welcome{color:#fff;text-shadow:0 2px 9px #000b}.cards{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:20px}.card{position:relative;display:flex;flex-direction:column;align-items:stretch;min-height:225px;padding:0;overflow:hidden;border:1px solid #ffffff88;border-radius:18px;background:#fff;text-align:left;box-shadow:0 12px 30px #0005;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-5px);border-color:var(--r)}.thumb{height:126px;display:grid;place-items:center;border-bottom:3px solid var(--r);background:linear-gradient(135deg,#102847,#315d86);color:#fff;font-size:26px;font-weight:900}.cardInfo{display:flex;align-items:center;gap:12px;padding:14px 16px}.icon{width:42px;height:42px;display:grid;place-items:center;border-radius:11px;background:#eef4f9;font-size:22px}.card b,.card small{display:block}.card small{margin-top:5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:205px}.arrow{position:absolute;right:10px;top:10px;width:31px;height:31px;display:grid;place-items:center;border-radius:50%;background:#e30613;color:#fff;font-weight:900}.viewerHead{height:59px;display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid #ddd;background:#fff}.back{background:#e9edf2}.newtab{margin-left:auto;background:#1479d7;color:#fff}.frame{width:100%;height:calc(100vh - 59px);border:0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.filter{border:1px solid #ffffffaa;border-radius:999px;background:#ffffff18;color:#fff;padding:9px 14px;font-weight:850;cursor:pointer}.filter.active{background:#fff;color:var(--r)}.category{margin:0 0 18px}.catHead{width:100%;display:flex;align-items:center;gap:10px;border:1px solid #ffffff80;border-radius:12px;padding:11px 14px;background:#ffffff18;color:#fff;font-weight:900;cursor:pointer;text-align:left}.catHead span:last-child{margin-left:auto}.category .cards{padding-top:13px}.category.closed .cards{display:none}.adminThumb{background:linear-gradient(135deg,#9d000b,#e30613)!important}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.cards{grid-template-columns:1fr}.top p{display:none}#portal{background-attachment:scroll}}</style></head><body><section id="login"><div class="loginCard"><div class="brand"><div class="logo">Claro</div><div><h1>Portal de Indicadores</h1><p>Acesso protegido pelo Supabase</p></div></div><form id="loginForm"><label>E-mail</label><input id="email" type="email" required autocomplete="username"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"><button id="loginBtn" class="enter">Entrar</button><div id="msg" class="msg"></div></form><div class="owner">Propriedade e criação: Demétrius Chiesa</div></div></section><section id="portal" class="hidden"><header class="top"><div class="logo">Claro</div><div><h2>Portal de Indicadores</h2><p>Performance, qualidade e atualização automática</p></div><div class="spacer"></div><button id="logout" class="logout">Sair</button></header><main class="content"><h2 class="welcome">Selecione uma categoria ou painel</h2><div id="filters" class="filters"></div><div id="categories"></div></main></section><section id="viewer" class="hidden"><div class="viewerHead"><button id="back" class="back">← Voltar ao portal</button><strong id="viewerTitle">Painel</strong><span id="viewerStatus">Abrindo...</span><button id="newtab" class="newtab">Abrir em nova aba</button></div><iframe id="frame" class="frame"></iframe></section><script>'use strict';const $=id=>document.getElementById(id),C=window.PORTAL_CONFIG,CATS=[['manutencao','Manutenção'],['instalacao','Instalação'],['rede','Rede'],['headend','Headend'],['backbone','Backbone'],['filtro','Filtro'],['tecnico','Técnico']];let sb,page='',pages=[],admin=false,current='todos';function show(x){['login','portal','viewer'].forEach(id=>$(id).classList.toggle('hidden',id!==x))}function client(){if(!sb)sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return sb}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function card(x,adm=false){return `<button class="card" data-page="${esc(x.arquivo)}" data-title="${esc(x.nome)}"><span class="arrow">›</span><div class="thumb ${adm?'adminThumb':''}">${esc(x.miniatura||x.nome)}</div><div class="cardInfo"><span class="icon">${adm?'🔐':'📊'}</span><span><b>${esc(x.nome)}</b><small>${esc(x.descricao||x.categoria)}</small></span></div></button>`}function bind(){document.querySelectorAll('.catHead').forEach(b=>b.onclick=()=>{const s=b.closest('.category');s.classList.toggle('closed');b.lastElementChild.textContent=s.classList.contains('closed')?'+':'−'});document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{page=c.dataset.page;$('viewerTitle').textContent=c.dataset.title;$('viewerStatus').textContent='Abrindo...';$('frame').src=page;show('viewer')})}function render(){const available=CATS.filter(c=>pages.some(p=>(p.categoria||'manutencao')===c[0]));$('filters').innerHTML=[['todos','Todos'],...available].map(c=>`<button class="filter ${current===c[0]?'active':''}" data-filter="${c[0]}">${c[1]}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{current=b.dataset.filter;render()});let html='';for(const [code,label] of available){if(current!=='todos'&&current!==code)continue;const list=pages.filter(p=>(p.categoria||'manutencao')===code);html+=`<section class="category"><button class="catHead"><span>${label}</span><small>${list.length} painel(is)</small><span>−</span></button><div class="cards">${list.map(x=>card(x)).join('')}</div></section>`}if(admin&&(current==='todos'||current==='manutencao'))html+=`<section class="category"><button class="catHead"><span>Administração</span><small>3 módulos</small><span>−</span></button><div class="cards">${card({nome:'Central de Atualização',arquivo:'atualizador_relatorios.html',miniatura:'ATUALIZAR',descricao:'Bases atuais e históricas'},true)}${card({nome:'Administrar Permissões',arquivo:'admin_permissoes.html',miniatura:'PERMISSÕES',descricao:'Usuários e acessos'},true)}${card({nome:'Gerenciar Relatórios',arquivo:'admin_relatorios.html',miniatura:'NOVO RELATÓRIO',descricao:'Categorias e upload HTML'},true)}</div></section>`;$('categories').innerHTML=html;bind()}async function loadPortal(user){const p=await client().rpc('obter_meu_perfil'),meu=p.data?.[0];if(p.error||!meu||!meu.ativo)throw Error('Usuário sem perfil ativo.');const ad=await client().rpc('eh_admin_portal',{p_user:user.id});admin=ad.data===true;const q=await client().rpc('listar_minhas_paginas_portal');if(q.error)throw q.error;pages=q.data||[];render()}async function enter(session){if(!session){show('login');return}try{await loadPortal(session.user);show('portal')}catch(e){show('login');$('msg').textContent=e.message}}async function init(){const{data}=await client().auth.getSession();await enter(data.session)}$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;$('msg').textContent='Validando...';const{data,error}=await client().auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginBtn').disabled=false;if(error){$('msg').textContent=error.message;return}$('msg').textContent='';await enter(data.session)};$('logout').onclick=async()=>{await client().auth.signOut();show('login')};$('frame').onload=()=>$('viewerStatus').textContent='Carregado';$('back').onclick=()=>{$('frame').src='about:blank';show('portal')};$('newtab').onclick=()=>page&&window.open(page,'_blank','noopener');init();</script></body></html>
