<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar Permissões</title><script src="./portal-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--r:#e30613;--i:#172033;--m:#667085;--l:#d8dee8}*{box-sizing:border-box}body{margin:0;background:#f3f5f8;font-family:Segoe UI,Arial;color:var(--i)}header{padding:17px 22px;background:linear-gradient(110deg,#a7000c,var(--r));color:#fff;display:flex;align-items:center}header h1{margin:0;font-size:22px}.back{margin-left:auto;border:0;border-radius:10px;padding:10px 13px;background:#fff;color:var(--r);font-weight:900}.wrap{max-width:1100px;margin:24px auto;padding:0 15px}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:18px;margin-bottom:14px}.grid,.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label,.title{display:block;font-size:11px;color:var(--m);font-weight:900;margin-bottom:6px}select{width:100%;height:42px;border:1px solid #aeb9c8;border-radius:10px;background:#fff;padding:0 10px}.check{display:flex;gap:8px;border:1px solid var(--l);border-radius:10px;padding:10px;background:#fafbfc}.check small{display:block;color:var(--m);margin-top:3px}.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--r);color:#fff;font-weight:900}.msg{display:none;margin-top:12px;padding:11px;border-radius:10px}.ok{display:block;background:#e9f8ef;color:#137a3b}.err{display:block;background:#fff0f0;color:#b42318}.hint{font-size:12px;color:var(--m)}@media(max-width:700px){.grid,.checks{grid-template-columns:1fr}}</style></head><body><header><h1>Administração de Permissões</h1><button class="back" onclick="location.href='index.html'">Voltar ao portal</button></header><main class="wrap"><section class="card"><p class="hint">Somente Demétrius pode usar esta página.</p><div class="grid"><div class="field"><label>USUÁRIO</label><select id="usuario"></select></div><div class="field"><label>PERFIL DE VISUALIZAÇÃO</label><select id="perfil"><option>master</option><option>manutencao</option><option>instalacao</option><option>rede</option><option>headend</option><option>backbone</option><option>filtro</option><option>tecnico</option></select></div></div><label class="check" style="margin-top:10px"><input id="ativo" type="checkbox"><span><b>Usuário ativo</b></span></label></section><section class="card"><span class="title">PÁGINAS INDIVIDUAIS</span><div id="paginas" class="checks"></div></section><section class="card"><span class="title">ARQUIVOS QUE PODE ATUALIZAR</span><div id="arquivos" class="checks"></div></section><button id="salvar" class="btn">Salvar permissões</button><div id="msg" class="msg"></div></main><script>
'use strict';const $=x=>document.getElementById(x),C=window.PORTAL_CONFIG;let sb,usuarios=[],paginas=[],arquivos=[];function say(t,k){$('msg').className='msg '+k;$('msg').textContent=t}async function init(){sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const s=await sb.auth.getSession();if(!s.data.session){location.href='index.html';return}const ad=await sb.rpc('eh_admin_portal',{p_user:s.data.session.user.id});if(ad.data!==true){document.body.innerHTML='<main class="wrap"><section class="card"><h2>Acesso negado</h2></section></main>';return}const [u,p,a]=await Promise.all([sb.rpc('admin_listar_perfis'),sb.from('paginas_portal').select('id,nome,arquivo,ativo').eq('ativo',true).order('nome'),sb.from('arquivos_portal').select('*').eq('ativo',true).order('ordem')]);if(u.error||p.error||a.error){say((u.error||p.error||a.error).message,'err');return}usuarios=u.data;paginas=p.data;arquivos=a.data;$('usuario').innerHTML=usuarios.map(x=>`<option value="${x.user_id}">${x.nome} - ${x.perfil}</option>`).join('');$('paginas').innerHTML=paginas.map(x=>`<label class="check"><input type="checkbox" data-page="${x.id}"><span><b>${x.nome}</b><small>${x.arquivo}</small></span></label>`).join('');$('arquivos').innerHTML=arquivos.map(x=>`<div class="check"><span><b>${x.titulo}</b><small>${x.area} - ${x.caminho_atual}</small><label><input type="checkbox" data-atual="${x.id}"> Atual</label> <label><input type="checkbox" data-hist="${x.id}" ${x.permite_historico?'':'disabled'}> Histórico</label></span></div>`).join('');$('usuario').onchange=carrega;await carrega()}
async function carrega(){const id=$('usuario').value,u=usuarios.find(x=>x.user_id===id);$('perfil').value=u.perfil;$('ativo').checked=u.ativo;document.querySelectorAll('[data-page],[data-atual],[data-hist]').forEach(x=>x.checked=false);const [p,a]=await Promise.all([sb.from('permissoes_paginas_usuarios').select('*').eq('user_id',id).eq('permitido',true),sb.from('permissoes_arquivos').select('*').eq('user_id',id).eq('ativo',true)]);(p.data||[]).forEach(x=>document.querySelector(`[data-page="${x.pagina_id}"]`)?.click());(a.data||[]).forEach(x=>{const c=document.querySelector(`[data-atual="${x.arquivo_id}"]`),h=document.querySelector(`[data-hist="${x.arquivo_id}"]`);if(c)c.checked=x.pode_atualizar_atual;if(h)h.checked=x.pode_enviar_historico})}
$('salvar').onclick=async()=>{const id=$('usuario').value;try{$('salvar').disabled=true;let r=await sb.rpc('admin_definir_perfil',{p_user_id:id,p_perfil:$('perfil').value,p_ativo:$('ativo').checked});if(r.error)throw r.error;r=await sb.from('permissoes_paginas_usuarios').delete().eq('user_id',id);if(r.error)throw r.error;const ps=[...document.querySelectorAll('[data-page]:checked')].map(e=>({user_id:id,pagina_id:+e.dataset.page,permitido:true}));if(ps.length){r=await sb.from('permissoes_paginas_usuarios').insert(ps);if(r.error)throw r.error}r=await sb.from('permissoes_arquivos').delete().eq('user_id',id);if(r.error)throw r.error;const ars=arquivos.map(x=>({user_id:id,arquivo_id:x.id,pode_atualizar_atual:document.querySelector(`[data-atual="${x.id}"]`).checked,pode_enviar_historico:document.querySelector(`[data-hist="${x.id}"]`)?.checked||false,ativo:true})).filter(x=>x.pode_atualizar_atual||x.pode_enviar_historico);if(ars.length){r=await sb.from('permissoes_arquivos').insert(ars);if(r.error)throw r.error}say('Permissões salvas com sucesso.','ok')}catch(e){say('Erro: '+e.message,'err')}finally{$('salvar').disabled=false}};init();
</script></body></html>
