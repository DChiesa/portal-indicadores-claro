<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar Permissões</title><script src="./portal-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--r:#e30613;--blue:#214f79;--ink:#172033;--muted:#667085}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f7fb;color:var(--ink)}.top{display:flex;gap:12px;align-items:center;background:#fff;border-bottom:1px solid #dde5ef;padding:12px 18px}.back{border:0;border-radius:11px;background:#e9edf2;padding:10px 14px;font-weight:900}.wrap{max-width:1100px;margin:20px auto;padding:0 14px}.box{background:#fff;border:1px solid #d7deea;border-radius:16px;padding:15px;margin-bottom:14px}label{font-size:12px;font-weight:900;color:#26385d;display:block;margin-bottom:7px}select{width:100%;padding:12px;border:1px solid #b8c6d8;border-radius:10px;background:#fff;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:10px}.item{border:1px solid #d7deea;border-radius:12px;padding:12px;background:#fbfcfe}.item b{display:block;margin-bottom:5px}.path{font-size:11px;color:#536078;margin-bottom:6px}.save{border:0;border-radius:10px;background:var(--r);color:#fff;padding:12px 18px;font-weight:900}.msg{margin-top:12px;border-radius:10px;padding:12px}.ok{background:#e7f8ed;color:#075b28}.err{background:#ffe8e8;color:#9f0000}@media(max-width:760px){.row,.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><button class="back" onclick="location.href='index.html'">← Voltar ao portal</button><h2>Administrar Permissões</h2></div><main class="wrap"><div class="box"><p><b>Somente Demétrius pode usar esta página.</b></p><div class="row"><div><label>USUÁRIO</label><select id="user"></select></div><div><label>PERFIL DE VISUALIZAÇÃO</label><select id="perfil"><option value="master">master</option><option value="manutencao">manutenção</option><option value="instalacao">instalação</option><option value="rede">rede</option><option value="backbone">backbone</option><option value="tecnico">técnico</option></select></div></div><label style="margin-top:12px"><input id="ativo" type="checkbox" checked> Usuário ativo</label></div><div class="box"><h3>Páginas individuais</h3><p style="color:#667085;font-size:13px">Mantido pelo portal atual. Esta correção não altera essa regra.</p></div><div class="box"><h3>Arquivos que pode atualizar</h3><div id="reports" class="grid"></div></div><button class="save" onclick="salvar()">Salvar permissões</button><div id="msg"></div></main><script>'use strict';const C=window.PORTAL_CONFIG,$=id=>document.getElementById(id);let sb=null,users=[],reports=[];function client(){if(!sb)sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return sb}function msg(t,ok=true){$('msg').className='msg '+(ok?'ok':'err');$('msg').textContent=t}async function checkAdmin(){const s=(await client().auth.getSession()).data.session;if(!s){location.href='index.html';return false}if(!String(s.user.email||'').toLowerCase().includes('demetrius377')){document.body.innerHTML='<div style="padding:30px;font-family:Segoe UI">Somente Demétrius pode usar esta página.</div>';return false}return true}async function init(){if(!await checkAdmin())return;let u=await client().rpc('portal_admin_list_users');if(u.error){msg('Erro usuários: '+u.error.message,false);return}users=u.data||[];$('user').innerHTML=users.map(x=>`<option value="${x.user_key}">${x.nome||x.user_key} - ${x.perfil||''}</option>`).join('');let r=await client().rpc('portal_admin_list_update_reports');if(r.error){msg('Erro relatórios: '+r.error.message,false);return}reports=r.data||[];desenharReports();$('user').onchange=carregarDoUsuario;await carregarDoUsuario()}function desenharReports(){$('reports').innerHTML=reports.map(x=>`<div class="item"><b>${x.report_title}</b><div class="path">${x.current_path}</div><label><input type="checkbox" data-key="${x.report_key}" data-tipo="atual"> Atual</label> <label><input type="checkbox" data-key="${x.report_key}" data-tipo="historico"> Histórico</label></div>`).join('')}async function carregarDoUsuario(){document.querySelectorAll('[data-key]').forEach(c=>c.checked=false);const u=users.find(x=>x.user_key===$('user').value);$('perfil').value=u?.perfil||'manutencao';$('ativo').checked=u?.ativo!==false;const q=await client().from('portal_update_permissions').select('*').in('user_email',[$('user').value,String($('user').value).split('@')[0]]);(q.data||[]).forEach(p=>{const a=document.querySelector(`[data-key="${p.report_key}"][data-tipo="atual"]`);const h=document.querySelector(`[data-key="${p.report_key}"][data-tipo="historico"]`);if(a)a.checked=!!p.can_update_current;if(h)h.checked=!!p.can_update_history})}async function salvar(){const user=$('user').value,perfil=$('perfil').value,items=[];reports.forEach(r=>{const a=document.querySelector(`[data-key="${r.report_key}"][data-tipo="atual"]`)?.checked||false;const h=document.querySelector(`[data-key="${r.report_key}"][data-tipo="historico"]`)?.checked||false;if(a||h)items.push({...r,user_email:user,user_profile:perfil,can_update_current:a,can_update_history:h,active:true,updated_by:'demetrius377'})});const res=await client().rpc('portal_admin_save_update_permissions',{p_user_email:user,p_user_profile:perfil,p_permissions:items});if(res.error){msg('Erro ao salvar: '+res.error.message,false);return}msg('Permissões salvas com sucesso.');await carregarDoUsuario()}init();</script></body></html>
