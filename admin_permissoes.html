<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar Permissões</title><script src="./portal-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--r:#e30613;--blue:#214f79;--ink:#172033;--muted:#667085}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f7fb;color:var(--ink)}.top{display:flex;gap:12px;align-items:center;background:#fff;border-bottom:1px solid #dde5ef;padding:12px 18px}.back{border:0;border-radius:11px;background:#e9edf2;padding:10px 14px;font-weight:900}.wrap{max-width:1100px;margin:20px auto;padding:0 14px}.box{background:#fff;border:1px solid #d7deea;border-radius:16px;padding:15px;margin-bottom:14px}label{font-size:12px;font-weight:900;color:#26385d;display:block;margin-bottom:7px}select{width:100%;padding:12px;border:1px solid #b8c6d8;border-radius:10px;background:#fff;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:10px}.item{border:1px solid #d7deea;border-radius:12px;padding:12px;background:#fbfcfe}.item b{display:block;margin-bottom:5px}.path{font-size:11px;color:#536078;margin-bottom:6px}.save{border:0;border-radius:10px;background:var(--r);color:#fff;padding:12px 18px;font-weight:900}.msg{margin-top:12px;border-radius:10px;padding:12px}.ok{background:#e7f8ed;color:#075b28}.err{background:#ffe8e8;color:#9f0000}.hint{color:#667085;font-size:13px}@media(max-width:760px){.row,.grid{grid-template-columns:1fr}}</style>
<!-- ALTERACAO: visual aprovado da terceira imagem; funcionalidade preservada -->
<link rel="stylesheet" href="assets/claro-visual-aprovado.css">
</head><body><div class="top"><button class="back" onclick="location.href='index.html'">← Voltar ao portal</button><h2>Administrar Permissões</h2></div><main class="wrap"><div class="box"><p><b>Somente Demétrius pode usar esta página.</b></p><div class="row"><div><label>USUÁRIO</label><select id="user"></select></div><div><label>PERFIL</label><select id="perfil"><option value="master">master</option><option value="manutencao">manutenção</option><option value="instalacao">instalação</option><option value="rede">rede</option><option value="headend">headend</option><option value="backbone">backbone</option><option value="filtro">filtro</option><option value="tecnico">técnico</option></select></div></div><label style="margin-top:12px"><input id="ativo" type="checkbox" checked> Usuário ativo</label></div><div class="box"><h3>Relatórios que pode visualizar</h3><p class="hint">Uma seleção individual prevalece sobre o perfil, inclusive para usuários master.</p><div id="pages" class="grid"></div></div><div class="box"><h3>Arquivos que pode atualizar</h3><div id="reports" class="grid"></div></div><button class="save" id="save">Salvar permissões</button><div id="msg"></div></main><script>
'use strict';
const C=window.PORTAL_CONFIG,$=i=>document.getElementById(i);let sb,users=[],pages=[],reports=[];
const cli=()=>sb||(sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}));
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const slug=v=>norm(v).replace(/\.html?$/,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
function msg(t,ok=true){$('msg').className='msg '+(ok?'ok':'err');$('msg').textContent=t}
function caminho(p){const f=String(p.arquivo||'').split('/').pop();return C.FILES?.[f]||'atual/'+slug(f||p.codigo||p.nome)+'.xlsx'}
async function sincronizar(){const q=await cli().rpc('portal_admin_list_reports');if(q.error)throw q.error;for(const p of q.data||[]){if(p.ativo===false)continue;const k=slug(p.codigo||p.arquivo||p.nome);if(!k)continue;const r=await cli().rpc('portal_admin_sync_update_report_v3',{p_report_key:k,p_report_title:p.nome||p.titulo||k,p_category_key:p.categoria||'manutencao',p_report_file:p.arquivo||'',p_current_path:caminho(p),p_history_path:'historico/'+k,p_allow_history:true});if(r.error)throw r.error}}
async function init(){const s=(await cli().auth.getSession()).data.session;if(!s){location.href='index.html';return}if(!String(s.user.email||'').toLowerCase().includes('demetrius377')){document.body.innerHTML='<div style="padding:30px">Somente Demétrius pode usar esta página.</div>';return}try{msg('Sincronizando relatórios novos...');await sincronizar();const [u,p,o,n]=await Promise.all([cli().rpc('portal_admin_list_users_v2'),cli().rpc('portal_admin_list_pages_v2'),cli().rpc('portal_admin_list_update_reports_v2'),cli().rpc('portal_admin_list_update_reports_v3')]);if(u.error||p.error||o.error||n.error)throw(u.error||p.error||o.error||n.error);users=u.data||[];pages=p.data||[];const old=(o.data||[]).map(x=>({...x,src:'old',dom:'old:'+x.id}));const seen=new Set(old.map(x=>norm(x.caminho_atual||x.titulo)));const nov=(n.data||[]).filter(x=>!seen.has(norm(x.caminho_atual||x.titulo))).map(x=>({...x,src:'v3',dom:'v3:'+x.id}));reports=[...old,...nov];$('user').innerHTML=users.map(x=>`<option value="${x.user_id}">${esc(x.nome||x.email)} - ${esc(x.email||'')} - ${esc(x.perfil)}</option>`).join('');$('pages').innerHTML=pages.map(x=>`<div class="item"><b>${esc(x.nome)}</b><div class="path">${esc(x.categoria||'')} • ${esc(x.arquivo||'')}</div><label><input type="checkbox" data-page="${x.id}"> Visualizar</label></div>`).join('');$('reports').innerHTML=reports.map(x=>`<div class="item"><b>${esc(x.titulo)}</b><div class="path">${esc(x.caminho_atual)}</div><label><input type="checkbox" data-file="${x.dom}" data-kind="current"> Atual</label><label><input type="checkbox" data-file="${x.dom}" data-kind="history" ${x.permite_historico?'':'disabled'}> Histórico</label></div>`).join('');$('user').onchange=loadUser;$('save').onclick=save;await loadUser()}catch(e){msg('Erro ao carregar: '+(e.message||e),false)}}
function chk(id,a,h){const c=document.querySelector(`[data-file="${id}"][data-kind="current"]`),d=document.querySelector(`[data-file="${id}"][data-kind="history"]`);if(c)c.checked=!!a;if(d)d.checked=!!h}
async function loadUser(){document.querySelectorAll('[data-page],[data-file]').forEach(x=>x.checked=false);const id=$('user').value,u=users.find(x=>x.user_id===id);$('perfil').value=u?.perfil||'manutencao';$('ativo').checked=u?.ativo!==false;const [q,v]=await Promise.all([cli().rpc('portal_admin_get_user_permissions_v2',{p_user_id:id}),cli().rpc('portal_admin_get_user_update_permissions_v3',{p_user_id:id})]);if(q.error||v.error){msg('Erro ao consultar: '+(q.error||v.error).message,false);return}const d=q.data||{};(d.pages||[]).forEach(x=>{const e=document.querySelector(`[data-page="${x.pagina_id}"]`);if(e)e.checked=!!x.permitido});(d.files||[]).forEach(x=>chk('old:'+x.arquivo_id,x.pode_atualizar_atual,x.pode_enviar_historico));(v.data||[]).forEach(x=>chk('v3:'+x.report_id,x.pode_atualizar_atual,x.pode_enviar_historico));msg('Permissões carregadas. Novos relatórios sincronizados.')}
const val=(x,k)=>!!document.querySelector(`[data-file="${x.dom}"][data-kind="${k}"]`)?.checked;
async function save(){const id=$('user').value,pp=pages.map(x=>({pagina_id:x.id,permitido:!!document.querySelector(`[data-page="${x.id}"]`)?.checked})),f=s=>reports.filter(x=>x.src===s).map(x=>({arquivo_id:x.id,pode_atualizar_atual:val(x,'current'),pode_enviar_historico:val(x,'history')}));$('save').disabled=true;const [a,b]=await Promise.all([cli().rpc('portal_admin_save_user_permissions_v2',{p_user_id:id,p_perfil:$('perfil').value,p_ativo:$('ativo').checked,p_pages:pp,p_files:f('old')}),cli().rpc('portal_admin_save_user_update_permissions_v3',{p_user_id:id,p_files:f('v3')})]);$('save').disabled=false;if(a.error||b.error){msg('Erro ao salvar: '+(a.error||b.error).message,false);return}const u=users.find(x=>x.user_id===id);if(u){u.perfil=$('perfil').value;u.ativo=$('ativo').checked}msg('Permissões salvas com sucesso.');await loadUser()}
init();

</script><script src="assets/claro-visual-aprovado.js"></script>
</body></html>
