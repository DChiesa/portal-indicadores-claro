</head><body><div class="top"><button class="back" onclick="location.href='index.html'">← Voltar ao portal</button><h2>Administrar Permissões</h2></div><main class="wrap"><div class="box"><p><b>Somente Demétrius pode usar esta página.</b></p><div class="row"><div><label>USUÁRIO</label><select id="user"></select></div><div><label>PERFIL</label><select id="perfil"><option value="master">master</option><option value="manutencao">manutenção</option><option value="instalacao">instalação</option><option value="rede">rede</option><option value="headend">headend</option><option value="backbone">backbone</option><option value="filtro">filtro</option><option value="tecnico">técnico</option></select></div></div><label style="margin-top:12px"><input id="ativo" type="checkbox" checked> Usuário ativo</label></div><div class="box"><h3>Relatórios que pode visualizar</h3><p class="hint">Uma seleção individual prevalece sobre o perfil, inclusive para usuários master.</p><div id="pages" class="grid"></div></div><div class="box"><h3>Arquivos que pode atualizar</h3><div id="reports" class="grid"></div></div><button class="save" id="save">Salvar permissões</button><div id="msg"></div></main><script>
'use strict';

function chk(id,a,h){const c=document.querySelector(`[data-file="${id}"][data-kind="current"]`),d=document.querySelector(`[data-file="${id}"][data-kind="history"]`);if(c)c.checked=!!a;if(d)d.checked=!!h}
async function loadUser(){document.querySelectorAll('[data-page],[data-file]').forEach(x=>x.checked=false);const id=$('user').value,u=users.find(x=>x.user_id===id);$('perfil').value=u?.perfil||'manutencao';$('ativo').checked=u?.ativo!==false;const [q,v]=await Promise.all([cli().rpc('portal_admin_get_user_permissions_v2',{p_user_id:id}),cli().rpc('portal_admin_get_user_update_permissions_v3',{p_user_id:id})]);if(q.error||v.error){msg('Erro ao consultar: '+(q.error||v.error).message,false);return}const d=q.data||{};(d.pages||[]).forEach(x=>{const e=document.querySelector(`[data-page="${x.pagina_id}"]`);if(e)e.checked=!!x.permitido});(d.files||[]).forEach(x=>chk('old:'+x.arquivo_id,x.pode_atualizar_atual,x.pode_enviar_historico));(v.data||[]).forEach(x=>chk('v3:'+x.report_id,x.pode_atualizar_atual,x.pode_enviar_historico));msg('Permissões carregadas. Novos relatórios sincronizados.')}
const val=(x,k)=>!!document.querySelector(`[data-file="${x.dom}"][data-kind="${k}"]`)?.checked;
async function save(){const id=$('user').value,pp=pages.map(x=>({pagina_id:x.id,permitido:!!document.querySelector(`[data-page="${x.id}"]`)?.checked})),f=s=>reports.filter(x=>x.src===s).map(x=>({arquivo_id:x.id,pode_atualizar_atual:val(x,'current'),pode_enviar_historico:val(x,'history')}));$('save').disabled=true;const [a,b]=await Promise.all([cli().rpc('portal_admin_save_user_permissions_v2',{p_user_id:id,p_perfil:$('perfil').value,p_ativo:$('ativo').checked,p_pages:pp,p_files:f('old')}),cli().rpc('portal_admin_save_user_update_permissions_v3',{p_user_id:id,p_files:f('v3')})]);$('save').disabled=false;if(a.error||b.error){msg('Erro ao salvar: '+(a.error||b.error).message,false);return}const u=users.find(x=>x.user_id===id);if(u){u.perfil=$('perfil').value;u.ativo=$('ativo').checked}msg('Permissões salvas com sucesso.');await loadUser()}
init();
