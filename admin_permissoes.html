<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar Permissões</title><script src="./portal-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--r:#e30613;--blue:#214f79;--ink:#172033;--muted:#667085}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f7fb;color:var(--ink)}.top{display:flex;gap:12px;align-items:center;background:#fff;border-bottom:1px solid #dde5ef;padding:12px 18px}.back{border:0;border-radius:11px;background:#e9edf2;padding:10px 14px;font-weight:900}.wrap{max-width:1100px;margin:20px auto;padding:0 14px}.box{background:#fff;border:1px solid #d7deea;border-radius:16px;padding:15px;margin-bottom:14px}label{font-size:12px;font-weight:900;color:#26385d;display:block;margin-bottom:7px}select{width:100%;padding:12px;border:1px solid #b8c6d8;border-radius:10px;background:#fff;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:10px}.item{border:1px solid #d7deea;border-radius:12px;padding:12px;background:#fbfcfe}.item b{display:block;margin-bottom:5px}.path{font-size:11px;color:#536078;margin-bottom:6px}.save{border:0;border-radius:10px;background:var(--r);color:#fff;padding:12px 18px;font-weight:900}.msg{margin-top:12px;border-radius:10px;padding:12px}.ok{background:#e7f8ed;color:#075b28}.err{background:#ffe8e8;color:#9f0000}.hint{color:#667085;font-size:13px}@media(max-width:760px){.row,.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><button class="back" onclick="location.href='index.html'">← Voltar ao portal</button><h2>Administrar Permissões</h2></div><main class="wrap"><div class="box"><p><b>Somente Demétrius pode usar esta página.</b></p><div class="row"><div><label>USUÁRIO</label><select id="user"></select></div><div><label>PERFIL</label><select id="perfil"><option value="master">master</option><option value="manutencao">manutenção</option><option value="instalacao">instalação</option><option value="rede">rede</option><option value="headend">headend</option><option value="backbone">backbone</option><option value="filtro">filtro</option><option value="tecnico">técnico</option></select></div></div><label style="margin-top:12px"><input id="ativo" type="checkbox" checked> Usuário ativo</label></div><div class="box"><h3>Relatórios que pode visualizar</h3><p class="hint">Uma seleção individual prevalece sobre o perfil, inclusive para usuários master.</p><div id="pages" class="grid"></div></div><div class="box"><h3>Arquivos que pode atualizar</h3><div id="reports" class="grid"></div></div><button class="save" id="save">Salvar permissões</button><div id="msg"></div></main><script>'use strict';const C=window.PORTAL_CONFIG,$=id=>document.getElementById(id);let sb,users=[],pages=[],reports=[];function client(){return sb||(sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}))}function msg(t,ok=true){$('msg').className='msg '+(ok?'ok':'err');$('msg').textContent=t}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function init(){const ses=(await client().auth.getSession()).data.session;if(!ses){location.href='index.html';return}if(!String(ses.user.email||'').toLowerCase().includes('demetrius377')){document.body.innerHTML='<div style="padding:30px">Somente Demétrius pode usar esta página.</div>';return}const [u,p,r]=await Promise.all([client().rpc('portal_admin_list_users_v2'),client().rpc('portal_admin_list_pages_v2'),client().rpc('portal_admin_list_update_reports_v2')]);if(u.error||p.error||r.error){msg('Erro ao carregar: '+(u.error||p.error||r.error).message,false);return}users=u.data||[];pages=p.data||[];reports=r.data||[];$('user').innerHTML=users.map(x=>`<option value="${x.user_id}">${esc(x.nome||x.email)} - ${esc(x.email||'')} - ${esc(x.perfil)}</option>`).join('');$('pages').innerHTML=pages.map(x=>`<div class="item"><b>${esc(x.nome)}</b><div class="path">${esc(x.categoria||'')} • ${esc(x.arquivo||'')}</div><label><input type="checkbox" data-page="${x.id}"> Visualizar</label></div>`).join('');$('reports').innerHTML=reports.map(x=>`<div class="item"><b>${esc(x.titulo)}</b><div class="path">${esc(x.caminho_atual)}</div><label><input type="checkbox" data-file="${x.id}" data-kind="current"> Atual</label><label><input type="checkbox" data-file="${x.id}" data-kind="history" ${x.permite_historico?'':'disabled'}> Histórico</label></div>`).join('');$('user').onchange=loadUser;$('save').onclick=save;await loadUser()}async function loadUser(){document.querySelectorAll('[data-page],[data-file]').forEach(x=>x.checked=false);const id=$('user').value,u=users.find(x=>x.user_id===id);$('perfil').value=u?.perfil||'manutencao';$('ativo').checked=u?.ativo!==false;const q=await client().rpc('portal_admin_get_user_permissions_v2',{p_user_id:id});if(q.error){msg('Erro ao consultar permissões: '+q.error.message,false);return}const d=q.data||{};(d.pages||[]).forEach(x=>{const el=document.querySelector(`[data-page="${x.pagina_id}"]`);if(el)el.checked=!!x.permitido});(d.files||[]).forEach(x=>{const a=document.querySelector(`[data-file="${x.arquivo_id}"][data-kind="current"]`),h=document.querySelector(`[data-file="${x.arquivo_id}"][data-kind="history"]`);if(a)a.checked=!!x.pode_atualizar_atual;if(h)h.checked=!!x.pode_enviar_historico});msg('Permissões carregadas.')}async function save(){const id=$('user').value;const pagePerms=pages.map(x=>({pagina_id:x.id,permitido:!!document.querySelector(`[data-page="${x.id}"]`)?.checked}));const filePerms=reports.map(x=>({arquivo_id:x.id,pode_atualizar_atual:!!document.querySelector(`[data-file="${x.id}"][data-kind="current"]`)?.checked,pode_enviar_historico:!!document.querySelector(`[data-file="${x.id}"][data-kind="history"]`)?.checked}));$('save').disabled=true;const r=await client().rpc('portal_admin_save_user_permissions_v2',{p_user_id:id,p_perfil:$('perfil').value,p_ativo:$('ativo').checked,p_pages:pagePerms,p_files:filePerms});$('save').disabled=false;if(r.error){msg('Erro ao salvar: '+r.error.message,false);return}const u=users.find(x=>x.user_id===id);if(u){u.perfil=$('perfil').value;u.ativo=$('ativo').checked}msg('Permissões salvas com sucesso.');await loadUser()}init();</script></body></html>
