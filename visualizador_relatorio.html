<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatório</title><script src="./portal-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#f3f5f8}.status{padding:12px 16px;background:#171717;color:#fff}.status.err{background:#8f0010}.frame{width:100%;height:calc(100vh - 42px);border:0;background:#fff}</style><style id="CLARO_VIEWER_FIX_V2">#status{display:none!important}.frame{height:100vh!important}</style></head><body><div id="status" class="status">Carregando relatório...</div><iframe id="frame" class="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-modals allow-popups"></iframe><script>
'use strict';const C=window.PORTAL_CONFIG,$=x=>document.getElementById(x);function erro(t){$('status').className='status err';$('status').textContent=t}async function init(){if(!C){erro('portal-config.js não carregado.');return}const sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const session=(await sb.auth.getSession()).data.session;if(!session){location.href='index.html';return}const id=Number(new URLSearchParams(location.search).get('id'));if(!Number.isInteger(id)||id<=0){erro('Relatório não informado.');return}const q=await sb.rpc('obter_relatorio_portal',{p_id:id});if(q.error){erro('Falha ao consultar relatório: '+q.error.message);return}const rel=q.data?.[0];
/* CORRECAO ISOLADA: este relatorio deve usar a versao oficial do GitHub.
   Os demais relatorios continuam usando portal-html sem qualquer alteracao. */
const nomeRel=String(rel?.nome||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
if(nomeRel.includes('estudo')&&nomeRel.includes('codigo')){
  document.title=rel.nome||'Estudo de Códigos AT1';
  $('status').textContent=rel.nome||'Estudo de Códigos AT1';
  $('frame').removeAttribute('srcdoc');
  $('frame').src='./estudo_codigos_cluster.html?v='+Date.now();
  return;
}
if(!rel?.storage_path){erro('Relatório indisponível. Cadastro sem arquivo HTML vinculado.');return}document.title=rel.nome;const d=await sb.storage.from('portal-html').download(rel.storage_path);if(d.error){erro('Falha ao baixar HTML: '+d.error.message);return}let html=await d.data.text();if(!html.trim()){erro('O arquivo HTML está vazio.');return}if(!/<base\s/i.test(html))html=html.replace(/<head([^>]*)>/i,'<head$1><base href="./">');$('frame').srcdoc=html;$('status').textContent=rel.nome}
init();
</script></body></html>
