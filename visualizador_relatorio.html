<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatorio</title><script src="./portal-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#f3f5f8}.status{padding:12px 16px;background:#171717;color:#fff}.frame{width:100%;height:calc(100vh - 42px);border:0;background:#fff}</style></head><body><div id="status" class="status">Carregando relatorio...</div><iframe id="frame" class="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-modals allow-popups"></iframe><script>
'use strict';const C=window.PORTAL_CONFIG,$=x=>document.getElementById(x);async function init(){const sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}}),session=(await sb.auth.getSession()).data.session;if(!session){location.href='index.html';return}const id=Number(new URLSearchParams(location.search).get('id'));if(!id){$('status').textContent='Relatorio nao informado.';return}const q=await sb.from('paginas_portal').select('nome,storage_path,ativo').eq('id',id).single();if(q.error||!q.data?.ativo||!q.data.storage_path){$('status').textContent='Relatorio indisponivel.';return}document.title=q.data.nome;const d=await sb.storage.from('portal-html').download(q.data.storage_path);if(d.error){$('status').textContent='Falha: '+d.error.message;return}let html=await d.data.text();if(!/<base\s/i.test(html))html=html.replace(/<head([^>]*)>/i,'<head$1><base href="./">');$('frame').srcdoc=html;$('status').textContent=q.data.nome}init();
</script></body></html>
