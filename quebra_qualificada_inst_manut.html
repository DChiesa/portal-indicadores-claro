<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font:14px Segoe UI,Arial;color:#172230}.top{background:#c90000;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:14px;align-items:center}.logo{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#d00000;font-weight:900}.top h1{margin:0;font-size:28px}.btn{border:0;border-radius:9px;padding:10px 13px;background:#fff;color:#b00000;font-weight:800;cursor:pointer}.wrap{padding:16px}.status,.card{background:#fff;border-radius:14px;padding:13px;box-shadow:0 2px 8px #0001}.status{margin-bottom:12px;background:#fff3cd;color:#664d03;font-weight:700}.status.ok{background:#dcfce7;color:#166534}.status.err{background:#fee2e2;color:#991b1b}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tab{padding:10px 14px;border:1px solid #ddd;border-radius:10px;background:#fff;font-weight:800;cursor:pointer}.tab.on{background:#d00000;color:#fff}.filters{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}.filters label{font-weight:800;display:block;margin-bottom:4px}.filters select{width:100%;height:100px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0}.kpi b{font-size:28px;display:block;margin-top:5px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}.chart{height:430px}.table{margin-top:12px}.tw{max-height:520px;overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:7px;border:1px solid #ddd}th{position:sticky;top:0;background:#b00000;color:#fff}.cert{text-align:center;padding:16px;color:#667085;font-weight:700}input[type=file]{display:none}@media(max-width:1000px){.filters{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.filters,.kpis{grid-template-columns:1fr}}</style></head>
<body><header class="top"><div class="brand"><div class="logo">Claro</div><h1>Quebra Qualificada</h1></div><div><label class="btn" for="file">Carregar Excel manualmente</label><input id="file" type="file" accept=".xlsx,.xls,.csv"></div></header><main class="wrap"><div id="status" class="status">Carregando a base atual...</div><div id="tabs" class="tabs"></div><section class="card"><div id="filters" class="filters"></div></section><section class="kpis"><div class="card">Resultado<b id="rate">0,0%</b></div><div class="card">Com quebra<b id="num">0</b></div><div class="card">Denominador<b id="den">0</b></div><div class="card">Meta<b id="meta">0,0%</b></div></section><section class="grid"><div class="card"><h3 id="dailyTitle">Resultado diário</h3><div id="daily" class="chart"></div></div><div class="card"><h3>Resultado por cidade</h3><div id="cities" class="chart"></div></div></section><section class="card table"><h3 id="tableTitle">Dados</h3><div class="tw"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></section></main><footer class="cert">Certificado de propriedade: Demétrius Chiesa</footer>
<script>'use strict';const $=x=>document.getElementById(x),N=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase(),E=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const URL='https://frxfoztyctrvsobbawmo.supabase.co',KEY='sb_publishable_or6yc7T71Hpyajn9ctn1FA_BjsB6LhL',BUCKET='bases-tecnico',PATH='atual/quebra_qualificado.xlsx';
const tabs={m:{l:'Quebra Migração',t:.20,b:r=>N(r.MIGRACAO)==='SIM',n:r=>br(r)},p:{l:'Quebra Prospect',t:.055,b:r=>N(r.MIGRACAO)==='NAO'&&['INSTALACAO','SERVICOS'].includes(N(r.GRUPO_OS)),n:r=>br(r)},qp:{l:'Qualificada Prospect',t:.055,b:r=>N(r.MIGRACAO)==='NAO'&&['INSTALACAO','SERVICOS'].includes(N(r.GRUPO_OS)),n:r=>br(r)&&N(r.RESPONSAVEL_QUEBRA)==='SERVICOS DE CAMPO'},qm:{l:'Qualificada Migração',t:.20,b:r=>N(r.MIGRACAO)==='SIM',n:r=>br(r)&&N(r.RESPONSAVEL_QUEBRA)==='SERVICOS DE CAMPO'}};
const fd=[['MES','Mês'],['DSC_MUNICIPIO','Cidade'],['UN_TECNICO','Time'],['LOGIN_TEC','Técnico'],['TIPO_TRATAMENTO','Tratamento'],['GRUPO_OS','Grupo OS'],['TIPO_OS','Tipo OS']],tc=[['MES','Mês'],['DSC_MUNICIPIO','Cidade'],['UN_TECNICO','Time'],['LOGIN_TEC','Técnico'],['TIPO_TRATAMENTO','Tratamento'],['GRUPO_OS','Grupo OS'],['TIPO_OS','Tipo OS'],['RESPONSAVEL_QUEBRA','Responsável'],['MIGRACAO','Migração'],['COD_BAIXA','Cód. baixa'],['CONTRATO','Contrato'],['DAT_AGENDA','Data'],['MOTIVO_REAGENDAMENTO','Motivo']];let all=[],active='m',sel=Object.fromEntries(fd.map(x=>[x[0],new Set()]));function br(r){return N(r.TIPO_TRATAMENTO)==='COM QUEBRA DE AGENDA'}function date(v){if(v instanceof Date)return v;let m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);m=String(v).match(/^(\d{2})\/(\d{2})\/(\d{4})/);return m?new Date(+m[3],+m[2]-1,+m[1]):new Date(v)}function pct(v){return(v*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'}function met(rows){let n=rows.filter(tabs[active].n).length;return{n,d:rows.length,r:rows.length?n/rows.length:0}}
function init(){$('tabs').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="tab ${k===active?'on':''}" data-k="${k}">${v.l}</button>`).join('');$('filters').innerHTML=fd.map(([k,l])=>`<div><label>${l}</label><select multiple id="f${k}"></select></div>`).join('');$('tabs').onclick=e=>{if(!e.target.dataset.k)return;active=e.target.dataset.k;init();options();render()};fd.forEach(([k])=>$('f'+k).onchange=e=>{sel[k]=new Set([...e.target.selectedOptions].map(o=>o.value));options();render()})}
function pass(r,skip=''){return fd.every(([k])=>k===skip||!sel[k].size||sel[k].has(String(r[k]??'')))}function options(){fd.forEach(([k])=>{let vals=[...new Set(all.filter(r=>tabs[active].b(r)&&pass(r,k)).map(r=>String(r[k]??'')).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));sel[k]=new Set([...sel[k]].filter(x=>vals.includes(x)));$('f'+k).innerHTML=vals.map(v=>`<option ${sel[k].has(v)?'selected':''}>${E(v)}</option>`).join('')})}function rows(skipCity=false){return all.filter(r=>tabs[active].b(r)&&fd.every(([k])=>(skipCity&&k==='DSC_MUNICIPIO')||!sel[k].size||sel[k].has(String(r[k]??''))))}
function render(){let rr=rows(),m=met(rr),t=tabs[active];$('rate').textContent=pct(m.r);$('num').textContent=m.n;$('den').textContent=m.d;$('meta').textContent=pct(t.t);daily(rr);city();table(rr)}
function daily(rr){let chosen=[...sel.MES].sort().pop(),ds=rr.map(r=>date(r.DAT_AGENDA)).filter(d=>!isNaN(d));let ref;if(chosen){let m=chosen.match(/^(\d{2})\/(\d{4})$/);ref=new Date(+m[2],+m[1]-1,1)}else ref=ds.length?new Date(Math.max(...ds)):new Date();let y=ref.getFullYear(),mo=ref.getMonth(),last=new Date(y,mo+1,0).getDate(),x=Array.from({length:last},(_,i)=>String(i+1).padStart(2,'0')+'/'+String(mo+1).padStart(2,'0')),ms=x.map((_,i)=>met(rr.filter(r=>{let d=date(r.DAT_AGENDA);return !isNaN(d)&&d.getFullYear()===y&&d.getMonth()===mo&&d.getDate()===i+1})));$('dailyTitle').textContent=`Resultado diário de ${String(mo+1).padStart(2,'0')}/${y}`;plot('daily',x,ms)}function city(){let rr=rows(true),x=[...new Set(all.filter(tabs[active].b).map(r=>r.DSC_MUNICIPIO).filter(Boolean))].sort(),ms=x.map(c=>met(rr.filter(r=>r.DSC_MUNICIPIO===c)));plot('cities',x,ms)}function plot(id,x,ms){let t=tabs[active].t;Plotly.react(id,[{type:'bar',x,y:ms.map(m=>m.d?m.r:null),marker:{color:ms.map(m=>m.r<=t?'#16a34a':'#e60012')},text:ms.map(m=>m.d?m.n+'/'+m.d:''),textposition:'inside'}],{margin:{l:55,r:20,t:20,b:70},yaxis:{tickformat:'.0%',range:[0,1.05]},xaxis:{tickangle:-45,categoryorder:'array',categoryarray:x},shapes:[{type:'line',xref:'paper',x0:0,x1:1,y0:t,y1:t,line:{color:'#1261a0',dash:'dash'}}],annotations:[{xref:'paper',x:1,y:t,text:'Meta '+pct(t),showarrow:false,xanchor:'right',yanchor:'bottom'}]},{responsive:true,displayModeBar:false})}
function table(rr){$('tableTitle').textContent='Dados: '+tabs[active].l;$('head').innerHTML='<tr>'+tc.map(x=>`<th>${x[1]}</th>`).join('')+'</tr>';$('body').innerHTML=rr.slice(0,500).map(r=>'<tr>'+tc.map(([k])=>`<td>${E(r[k]??'')}</td>`).join('')+'</tr>').join('')}
async function wb(blob){let a=await blob.arrayBuffer(),w=XLSX.read(a,{type:'array',cellDates:true});return XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{defval:'',raw:true})}function load(data,name){all=data.map(r=>{let z={};Object.keys(r).forEach(k=>z[N(k)]=r[k]);let d=date(z.DAT_AGENDA);z.MES=!isNaN(d)?String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear():'';return z});options();render();$('status').className='status ok';$('status').textContent=`Base carregada: ${name} | ${all.length.toLocaleString('pt-BR')} registros`}
async function auto(){try{let sb=supabase.createClient(URL,KEY),r=await sb.storage.from(BUCKET).download(PATH);if(r.error)throw r.error;load(await wb(r.data),BUCKET+'/'+PATH)}catch(e){$('status').className='status err';$('status').textContent='Não foi possível carregar automaticamente: '+e.message+' | caminho: '+PATH}}$('file').onchange=async e=>{let f=e.target.files[0];if(f)load(await wb(f),f.name)};init();auto();</script></body></html>
