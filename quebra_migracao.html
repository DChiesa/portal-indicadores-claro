<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quebra Migração</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>body{margin:0;background:#f4f6f8;font-family:Segoe UI,Arial} .top{background:#c40000;color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.logo{width:60px;height:60px;border-radius:50%;background:#fff;color:#d40000;font-weight:700;display:flex;align-items:center;justify-content:center}.wrap{padding:16px}.filters,.kpis{display:grid;gap:12px}.filters{grid-template-columns:repeat(3,1fr)} .kpis{grid-template-columns:repeat(4,1fr);margin-top:12px}.card{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:14px}.chart{height:420px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px} table{width:100%;border-collapse:collapse}th{background:#b00000;color:#fff}th,td{border:1px solid #ddd;padding:6px}select{width:100%;height:120px}@media(max-width:900px){.grid,.filters,.kpis{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="brand"><div class="logo">Claro</div><div><h2 style="margin:0">QUEBRA MIGRAÇÃO</h2></div></div><div>Certificado de propriedade: Demétrius Chiesa</div></div><div class="wrap"><div class="filters"><div class="card"><b>Cidade</b><select multiple></select></div><div class="card"><b>Login Técnico</b><select multiple></select></div><div class="card"><b>Cód. Quebra</b><select multiple></select></div></div><div class="kpis"><div class="card"><h4>Total Contratos</h4><h1 id=t1>0</h1></div><div class="card"><h4>Com Quebra</h4><h1 id=t2>0</h1></div><div class="card"><h4>Produtivos</h4><h1 id=t3>0</h1></div><div class="card"><h4>% Quebra</h4><h1 id=t4>0%</h1></div></div><div class="grid"><div class="card"><h3>Motivo C/ Quebra</h3><div id=g1 class=chart></div></div><div class="card"><h3>Ranking Cidade + Cluster</h3><div id=g2 class=chart></div></div></div><div class="card" style="margin-top:14px"><h3>Quebra Diária</h3><div id=g3 class=chart></div></div><div class="card" style="margin-top:14px"><h3>Tabela Analítica</h3><table><thead><tr><th>Cidade</th><th>Contrato</th><th>Tratamento</th><th>Mot. Reag</th><th>Técnico</th></tr></thead><tbody></tbody></table></div></div><script>Plotly.newPlot('g1',[],{annotations:[{text:'Aguardando integração XLSX/Supabase',showarrow:false}]});Plotly.newPlot('g2',[],{annotations:[{text:'Dados serão calculados da planilha',showarrow:false}]});Plotly.newPlot('g3',[],{annotations:[{text:'Quebra diária carregada do Excel',showarrow:false}]});</script></body></html>
