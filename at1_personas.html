<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AT1 Personas</title>
<style>:root{--r:#d50000;--bg:#f3f4f6;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#202020}.top{height:100px;background:var(--r);color:#fff;display:grid;grid-template-columns:220px 1fr 330px;align-items:center;padding:12px 18px;box-shadow:0 2px 10px #0003}.logo{font-size:45px;font-weight:800}.title{text-align:center;font-size:36px;font-weight:900}.meta{text-align:right;font-weight:800;line-height:1.35}.owner{font-size:12px;margin-top:6px}.wrap{max-width:1700px;margin:auto;padding:18px}.controls,.panel{background:#fff;border-radius:15px;padding:15px;box-shadow:0 3px 15px #0001;margin-bottom:14px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{padding:10px 18px;border:1px solid var(--line);border-radius:25px;background:#fff;font-weight:800;cursor:pointer}.tab.active{background:var(--r);color:#fff;border-color:var(--r)}.filters{display:grid;grid-template-columns:repeat(5,1fr) auto;gap:10px;align-items:end}label{font-size:11px;color:#667085;font-weight:900;letter-spacing:.5px}select,button{height:42px;border:1px solid #cfd4dc;border-radius:9px;background:#fff;padding:0 10px;font:inherit}.export{background:#202020;color:#fff;font-weight:800}.msg{margin-top:12px;padding:10px;border-radius:8px;background:#fff0f0;border:1px solid #ffbcbc;color:#a00000;font-size:13px;display:none}.status{padding:18px;background:#fff;border-radius:13px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}.card h2{text-align:center;color:#555;font-size:20px;margin:0 0 8px}.cw{height:470px}.foot{text-align:right;color:#6b7280;font-size:11px;margin-top:8px}@media(max-width:950px){.top{height:auto;grid-template-columns:1fr;text-align:center}.meta{text-align:center}.filters,.charts{grid-template-columns:1fr}.cw{height:420px}} </style></head><body>
<header class="top" id="banner"><div class="logo">Claro•</div><div class="title">RANKING AT1 PERSONAS</div><div class="meta">ATUAL ATÉ <span id="asof">--/--</span><br><span id="prodBanner">TODOS</span><div class="owner">Certificado de propriedade: Demétrius Chiesa</div></div></header>
<main class="wrap"><section class="controls"><div class="tabs"><button class="tab active" data-mode="at1">AT1 Personas</button><button class="tab" data-mode="base">Base Personas Principal</button></div><div class="filters"><div><label>PRODUTO</label><select id="produto"></select></div><div><label>CIDADE ADICIONAL</label><select id="cidade"></select></div><div><label>CLUSTER ADICIONAL</label><select id="cluster"></select></div><div><label>MÊS</label><select id="mes"></select></div><div><label>ANO</label><select id="ano"></select></div><button id="exportar" class="export">Exportar dupla de gráficos</button></div><div id="msg" class="msg"></div></section><div id="status" class="status">Carregando AT1_BASE_PERSONAS.xlsx do Supabase...</div><section id="panel" class="panel" hidden><div class="charts"><article class="card"><h2 id="tc">RANKING AT1 CIDADE</h2><div class="cw"><canvas id="gc"></canvas></div></article><article class="card"><h2 id="tcl">RANKING AT1 CLUSTER</h2><div class="cw"><canvas id="gcl"></canvas></div></article></div></section><div class="foot">Fonte: AT1_BASE_PERSONAS.xlsx • Supabase Storage</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>/* PONTO_APROVADO: layout do relatório preservado. *//* ALTERAÇÃO: at1_personas.html é o relatório; AT1_BASE_PERSONAS.xlsx é a base. */
const CFG={url:'https://frxfoztyctrvsobbawmo.supabase.co',key:'sb_publishable_or6yc7T71Hpyajn9ctn1FA_BjsB6LhL',bucket:'bases-tecnico',path:'atual/AT1_BASE_PERSONAS.xlsx',cities:['Rosário do Sul',"Sant'Ana do Livramento",'São Gabriel','Rio Grande','Bagé','Pelotas','Alegrete','Uruguaiana'],clusters:['Porto Alegre','Caxias do Sul','Passo Fundo','Novo Hamburgo','Capão da Canoa','Santa Maria','Uruguaiana','Pelotas','Santa Cruz do Sul']};
const S={wb:null,rows:[],years:[],months:[],mode:'at1',c1:null,c2:null};const $=x=>document.getElementById(x),clean=x=>String(x??'').trim(),norm=x=>clean(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();function mk(v){if(v instanceof Date)return String(v.getMonth()+1).padStart(2,'0')+'/'+String(v.getFullYear()).slice(-2);let m=clean(v).match(/(\d{1,2})\D+(\d{2,4})/);return m?m[1].padStart(2,'0')+'/'+m[2].slice(-2):clean(v)}function opt(s,v,t=v){let o=document.createElement('option');o.value=v;o.textContent=t;s.append(o)}
async function load(){const c=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:false}}),st=c.storage.from(CFG.bucket);let {data,error}=await st.download(CFG.path);if(error||!data){const pub=st.getPublicUrl(CFG.path).data.publicUrl;const r=await fetch(pub+'?v='+Date.now(),{cache:'no-store'});if(r.ok)data=await r.blob();else throw new Error(`Acesso negado ou objeto invisível (${error?.message||r.status}). Confirme SELECT para anon em storage.objects no bucket bases-tecnico e o caminho ${CFG.path}.`)}return data.arrayBuffer()}
function parse(buf,year){if(buf)S.wb=XLSX.read(buf,{type:'array',cellDates:true});S.years=S.wb.SheetNames.filter(x=>/^20\d{2}$/.test(x)).sort((a,b)=>b-a);year=year&&S.wb.Sheets[year]?year:S.years[0];let a=XLSX.utils.sheet_to_json(S.wb.Sheets[year],{header:1,defval:null,raw:true}),h=a[1],ac=[],bc=[];for(let i=3;i<15;i++)if(h[i]!=null)ac.push([i,mk(h[i])]);for(let i=15;i<27;i++)if(h[i]!=null)bc.push([i,mk(h[i])]);let city='';S.rows=a.slice(2).map(r=>{if(clean(r[0]))city=clean(r[0]);let at1={},base={};ac.forEach(([i,k])=>at1[k]=Number(r[i]));bc.forEach(([i,k])=>base[k]=Number(r[i]));return{city,product:clean(r[1])||'Total',cluster:clean(r[2]),at1,base}}).filter(r=>r.city);S.months=[...new Set(ac.map(x=>x[1]))].filter(k=>S.rows.some(r=>Number.isFinite(r.at1[k])||Number.isFinite(r.base[k])));return year}
function filters(year){let ps=[...new Set(S.rows.map(r=>r.product))].sort(),cs=[...new Set(S.rows.map(r=>r.city))].sort((a,b)=>a.localeCompare(b,'pt-BR')),cls=[...new Set(S.rows.map(r=>r.cluster).filter(Boolean))].sort();$('produto').innerHTML='';ps.forEach(x=>opt($('produto'),x));$('produto').value=ps.includes('GPON')?'GPON':ps[0];$('cidade').innerHTML='';opt($('cidade'),'','Somente cidades padrão');cs.filter(x=>!CFG.cities.some(y=>norm(y)==norm(x))).forEach(x=>opt($('cidade'),x));$('cluster').innerHTML='';opt($('cluster'),'','Somente clusters padrão');cls.filter(x=>!CFG.clusters.some(y=>norm(y)==norm(x))).forEach(x=>opt($('cluster'),x));$('mes').innerHTML='';S.months.forEach(x=>opt($('mes'),x));$('mes').value=S.months.at(-1);$('ano').innerHTML='';S.years.forEach(x=>opt($('ano'),x));$('ano').value=year}
function val(rs,k){if(S.mode==='base')return rs.reduce((a,r)=>a+(Number.isFinite(r.base[k])?r.base[k]:0),0);rs=rs.filter(r=>Number.isFinite(r.at1[k]));let d=rs.reduce((a,r)=>a+(Number.isFinite(r.base[k])?r.base[k]:0),0);return rs.length?(d?rs.reduce((a,r)=>a+r.at1[k]*(r.base[k]||0),0)/d:rs.reduce((a,r)=>a+r.at1[k],0)/rs.length):null}function add(base,x){return x&& !base.some(y=>norm(y)==norm(x))?[...base,x]:[...base]}
function cityData(){let p=$('produto').value,k=$('mes').value;return add(CFG.cities,$('cidade').value).map(n=>({label:n,value:val(S.rows.filter(r=>norm(r.city)==norm(n)&&norm(r.product)==norm(p)),k)})).filter(x=>Number.isFinite(x.value)).sort((a,b)=>b.value-a.value)}function clusterData(){let p=$('produto').value,k=$('mes').value;return add(CFG.clusters,$('cluster').value).map(n=>({label:'CLUSTER '+n,value:val(S.rows.filter(r=>norm(r.cluster)==norm(n)&&norm(r.product)==norm(p)),k)})).filter(x=>Number.isFinite(x.value)).sort((a,b)=>b.value-a.value)}
function chart(el,d){return new Chart(el,{type:'bar',plugins:[ChartDataLabels],data:{labels:d.map(x=>x.label),datasets:[{data:d.map(x=>x.value),backgroundColor:d.map((x,i)=>i?'#d50000':'#090909'),barPercentage:.52}]},options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:25}},plugins:{legend:{display:false},datalabels:{anchor:'end',align:'end',formatter:v=>v.toLocaleString('pt-BR',{minimumFractionDigits:S.mode==='at1'?2:0,maximumFractionDigits:S.mode==='at1'?2:0})}},scales:{x:{grid:{display:false},ticks:{autoSkip:false,maxRotation:0}},y:{display:false,beginAtZero:true}}}})}function render(){S.c1?.destroy();S.c2?.destroy();S.c1=chart($('gc'),cityData());S.c2=chart($('gcl'),clusterData());let t=S.mode==='at1'?'AT1':'BASE PERSONAS';$('tc').textContent='RANKING '+t+' CIDADE';$('tcl').textContent='RANKING '+t+' CLUSTER';$('prodBanner').textContent=$('produto').value.toUpperCase();let[m,y]=$('mes').value.split('/').map(Number);$('asof').textContent=new Date(2000+y,m,0).getDate()+'/'+m}
async function boot(){try{let y=parse(await load());filters(y);$('status').remove();$('panel').hidden=false;render()}catch(e){$('status').textContent='Não foi possível abrir o Excel no Supabase.';$('msg').style.display='block';$('msg').textContent=e.message}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');S.mode=b.dataset.mode;render()});['produto','cidade','cluster','mes'].forEach(x=>$(x).onchange=render);$('ano').onchange=()=>{let y=$('ano').value;parse(null,y);filters(y);$('ano').value=y;render()};$('exportar').onclick=async()=>{let c=await html2canvas(document.body,{backgroundColor:'#fff'}),a=document.createElement('a');a.href=c.toDataURL();a.download='at1_personas.png';a.click()};boot();</script></body></html>
