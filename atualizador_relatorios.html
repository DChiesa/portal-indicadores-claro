 <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central de Atualização</title><script src="./portal-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--r:#e30613;--i:#172033;--m:#667085;--l:#d8dee8}*{box-sizing:border-box}body{margin:0;background:#f3f5f8;font-family:Segoe UI,Arial;color:var(--i)}header{padding:17px 22px;background:linear-gradient(110deg,#a7000c,var(--r));color:#fff;display:flex;align-items:center}header h1{margin:0;font-size:22px}.back{margin-left:auto;border:0;border-radius:10px;padding:10px 13px;background:#fff;color:var(--r);font-weight:900}.wrap{max-width:900px;margin:25px auto;padding:0 15px}.card{background:#fff;border:1px solid var(--l);border-radius:17px;padding:20px}.identity{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.info,.box{border:1px solid var(--l);border-radius:11px;padding:12px}.info small{display:block;color:var(--m);font-weight:800}.info b{display:block;margin-top:4px}.field{margin-top:15px}.field label{display:block;font-size:11px;font-weight:900;color:var(--m);margin-bottom:6px}.field select{width:100%;height:42px;border:1px solid #aeb9c8;border-radius:10px;background:#fff;padding:0 10px}.box{margin-top:15px;border-left:7px solid var(--r)}.box h2{margin:0 0 5px}.path{font-size:12px;color:var(--m);margin-bottom:11px}.row{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center}.pick{border:1px dashed #98a5b5;border-radius:10px;padding:11px}.btn{height:42px;border:0;border-radius:10px;padding:0 15px;background:var(--r);color:#fff;font-weight:900}.btn:disabled{opacity:.45}.msg{display:none;margin-top:14px;padding:11px;border-radius:10px;white-space:pre-wrap}.ok{display:block;background:#e9f8ef;color:#137a3b}.err{display:block;background:#fff0f0;color:#b42318}.wait{display:block;background:#fff8e7;color:#8a5000}.hidden{display:none}@media(max-width:650px){.identity,.row{grid-template-columns:1fr}}</style></head><body><header><h1>Central de Atualização de Relatórios</h1><button class="back" onclick="location.href='index.html'">Voltar ao portal</button></header><main class="wrap"><section class="card"><div class="identity"><div class="info"><small>LOGIN AUTENTICADO</small><b id="nome">Carregando...</b></div><div class="info"><small>PERFIL DE VISUALIZAÇÃO</small><b id="perfil">-</b></div><div class="info"><small>PERFIL DE ATUALIZAÇÃO</small><b id="areas">-</b></div></div><div class="field"><label>RELATÓRIO AUTORIZADO</label><select id="relatorio"><option>Carregando...</option></select></div><section class="box"><h2>Arquivo atual</h2><div id="atualInfo" class="path"></div><div class="row"><label class="pick"><input id="atual" type="file"></label><button id="enviaAtual" class="btn">Atualizar arquivo atual</button></div></section><section id="histBox" class="box"><h2>Arquivo histórico</h2><div id="histInfo" class="path"></div><div class="row"><label class="pick"><input id="historicos" type="file" multiple></label><button id="enviaHistorico" class="btn">Atualizar arquivos</button></div></section><div id="msg" class="msg"></div></section></main><script>
'use strict';const $=x=>document.getElementById(x),C=window.PORTAL_CONFIG,ERRO='Impossível carregar arquivo, verifique nome ou formato.';let sb,user,admin=false,lista=[];function say(t,k){$('msg').className='msg '+k;$('msg').textContent=t}function escolhido(){return lista.find(x=>String(x.id)===$('relatorio').value)}function regex(s){try{return new RegExp(s)}catch{return null}}async function log(a,c,t,f,r,m){try{await sb.from('logs_atualizacoes_arquivos').insert({user_id:user.id,arquivo_id:a.id,bucket_id:a.bucket_id,caminho:c,tipo:t,nome_original:f.name,tamanho_bytes:f.size,resultado:r,mensagem:m})}catch(e){console.warn(e)}}async function upload(a,c,f,t){const{error}=await sb.storage.from(a.bucket_id).upload(c,f,{upsert:true,cacheControl:'0',contentType:f.type||'application/octet-stream'});if(error){await log(a,c,t,f,'erro',error.message);throw error}await log(a,c,t,f,'sucesso','Arquivo gravado')}function mostra(){const a=escolhido();if(!a)return;$('atualInfo').textContent='Nome obrigatório: '+a.nome_atual+' | Destino: '+a.caminho_atual;$('atual').accept='.'+a.extensao;$('histBox').classList.toggle('hidden',!a.permite_historico);$('histInfo').textContent=a.permite_historico?'Pasta: '+a.pasta_historico+' | Nome conforme padrão cadastrado.':'Histórico não permitido.'}
$('enviaAtual').onclick=async()=>{const a=escolhido(),f=$('atual').files[0];if(!a||!f||f.name!==a.nome_atual||f.name.split('.').pop().toLowerCase()!==a.extensao.toLowerCase()){say(ERRO,'err');return}try{$('enviaAtual').disabled=true;say('Enviando...','wait');await upload(a,a.caminho_atual,f,'atual');say('Arquivo atual substituído com sucesso:\n'+a.caminho_atual,'ok');$('atual').value=''}catch(e){say('Falha: '+e.message,'err')}finally{$('enviaAtual').disabled=false}};
$('enviaHistorico').onclick=async()=>{const a=escolhido(),fs=[...$('historicos').files],r=regex(a?.regex_historico||'');if(!a||!a.permite_historico||!fs.length||!r||fs.some(f=>!r.test(f.name))){say(ERRO,'err');return}try{$('enviaHistorico').disabled=true;const out=[];for(const f of fs){say('Enviando '+f.name+'...','wait');await upload(a,a.pasta_historico+'/'+f.name,f,'historico');out.push('OK - '+f.name)}say(out.join('\n'),'ok');$('historicos').value=''}catch(e){say('Falha: '+e.message,'err')}finally{$('enviaHistorico').disabled=false}};
async function init(){sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const s=await sb.auth.getSession();user=s.data.session?.user;if(!user){location.href='index.html';return}const p=await sb.rpc('obter_meu_perfil'),meu=p.data?.[0];if(p.error){say('Falha ao consultar perfil: '+p.error.message,'err');return}if(!meu){say('Perfil não encontrado para este login.','err');return}if(!meu.ativo){say('Usuário sem perfil ativo.','err');return}$('nome').textContent=meu.nome;$('perfil').textContent=meu.perfil;const ad=await sb.rpc('eh_admin_portal',{p_user:user.id});admin=ad.data===true;const ar=await sb.from('arquivos_portal').select('*').eq('ativo',true).order('ordem');if(ar.error){say(ar.error.message,'err');return}if(admin)lista=ar.data||[];else{const pe=await sb.from('permissoes_arquivos').select('*').eq('user_id',user.id).eq('ativo',true);const m=new Map((pe.data||[]).filter(x=>x.pode_atualizar_atual||x.pode_enviar_historico).map(x=>[x.arquivo_id,x]));lista=(ar.data||[]).filter(x=>m.has(x.id)).map(x=>({...x,...m.get(x.id)}))}$('areas').textContent=admin?'TODAS - ADMINISTRADOR':[...new Set(lista.map(x=>x.area))].join(', ')||'SEM PERMISSÃO';$('relatorio').innerHTML=lista.length?lista.map(x=>`<option value="${x.id}">${x.titulo} - ${x.area}</option>`).join(''):'<option>Nenhum relatório autorizado</option>';$('relatorio').onchange=mostra;mostra()}init();
</script></body></html>
