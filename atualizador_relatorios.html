<link rel="stylesheet" href="./portal-report-header.css"><script src="./portal-report-header.js" defer></script></head><body><div class="top"><button class="back" onclick="location.href='index.html'">← Voltar ao portal</button><strong>Central de Atualização</strong><span id="topStatus">Carregando...</span><button class="newtab" onclick="window.open(location.href,'_blank','noopener')">Abrir em nova aba</button></div><div class="hero">Central de Atualização</div><main class="wrap"><div id="msg" class="warn">Carregando permissões...</div><div id="list" class="grid"></div></main><script>
'use strict';
const C=window.PORTAL_CONFIG;
const BUCKET=C?.BUCKET||'bases-tecnico';
const $=id=>document.getElementById(id);
let sb=null;
function client(){if(!sb)sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return sb}
function setMsg(t,cls){$('msg').className=cls||'warn';$('msg').textContent=t}
function normalizar(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function slugArquivo(v){return normalizar(v).replace(/\.html$/,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')}
function caminhoAutomatico(p){
  const arquivo=String(p.arquivo||p.report_file||p.page||'').split('/').pop();
  const configurado=C?.FILES?.[arquivo];
  if(configurado)return configurado;
  const base=slugArquivo(arquivo||p.codigo||p.report_key||p.nome||p.report_title);
  return base?'atual/'+base+'.xlsx':'';
}
function chaveLinha(x){return normalizar(x.report_key||x.codigo||x.arquivo||x.report_file||x.nome||x.report_title)}
async function carregar(){
 try{
  const sess=(await client().auth.getSession()).data.session;
  if(!sess){location.href='index.html';return}
  const email=normalizar(sess.user.email);
  const admin=email.includes('demetrius377');
  const [r,r3]=await Promise.all([client().rpc('portal_get_my_update_permissions_v2'),client().rpc('portal_get_my_update_permissions_v3')]);
  if(r.error||r3.error){setMsg('Erro ao carregar permissões: '+(r.error||r3.error).message,'err');return}
  let rows=(r.data||[]).map(x=>({...x}));
  const seenV3=new Set(rows.map(chaveLinha));for(const x of (r3.data||[])){const k=chaveLinha(x);if(k&&!seenV3.has(k)){rows.push({...x});seenV3.add(k)}}
  if(admin){
   const pag=await client().rpc('portal_admin_list_reports');
   if(!pag.error){
    const existentes=new Set(rows.map(chaveLinha));
    for(const p of (pag.data||[])){
     if(p.ativo===false)continue;
     const codigo=slugArquivo(p.codigo||p.nome||p.storage_path||'relatorio');
     const nome=normalizar(p.nome||p.titulo||p.codigo);
     if(codigo==='consulta_codigo_baixa'||nome==='consulta codigo baixa')continue;
     if((codigo==='dashboard_at1_historico'||codigo==='at1_historico'||nome==='at1 historico')&&rows.some(x=>normalizar(x.current_path)==='atual/at1.xlsx'))continue;
     const key=chaveLinha(p);
     if(!key||existentes.has(key))continue;
     const current=C?.FILES?.[String(p.arquivo||'').split('/').pop()]||'atual/'+codigo+'.xlsx';
     rows.push({report_key:p.codigo||codigo,report_title:p.nome||p.titulo||p.codigo,category_key:p.categoria||'manutencao',current_path:current,history_path:'historico/'+codigo,can_update_current:true,can_update_history:true,arquivo:p.arquivo});
     existentes.add(key);
    }
   }else console.warn('Lista automatica de relatorios:',pag.error);
  }
  $('topStatus').textContent='Carregado';
  if(!rows.length){setMsg('Seu login não possui relatórios liberados para atualização.','err');return}
  setMsg('Selecione o arquivo correto para cada relatório liberado.','ok');
  $('list').innerHTML='';rows.forEach(x=>$('list').appendChild(card(x)));
 }catch(e){setMsg(e.message||String(e),'err')}
}
function card(p){
 const div=document.createElement('div');div.className='card';
 div.innerHTML=`<div class="title">${p.report_title}</div><div class="meta">${p.category_key} • ${p.current_path||''}</div><div class="small">Atual: ${p.can_update_current?'liberado':'bloqueado'} | Histórico: ${p.can_update_history?'liberado':'bloqueado'}</div><input type="file" accept=".xlsx,.xls,.csv,.txt"><div class="actions"><button class="btn btnAtual" ${p.can_update_current?'':'disabled'}>Enviar Atual</button><button class="btn btnHist" ${p.can_update_history?'':'disabled'}>Enviar Histórico</button></div><div class="small status"></div>`;
 const inp=div.querySelector('input'),st=div.querySelector('.status');
 div.querySelector('.btnAtual').onclick=()=>upload(p,inp.files[0],'atual',st);
 div.querySelector('.btnHist').onclick=()=>upload(p,inp.files[0],'historico',st);
 return div
}
function caminhoAtualSeguro(p,file){
 let path=String(p.current_path||caminhoAutomatico(p)||'').trim();
 const nome=String(file?.name||'').trim();
 const folha=path.split('/').pop().toLowerCase();
 const caminhoGeradoPeloVisualizador=/^visualizador_relatorio(?:_html)?(?:_id_?\d+)?\.(?:xlsx|xls|csv|txt)$/i.test(folha);
 if((!path||caminhoGeradoPeloVisualizador)&&nome)path='atual/'+nome;
 return path;
}
async function upload(p,file,tipo,st){
 if(!file){st.textContent='Selecione um arquivo primeiro.';return}
 if(!/\.(xlsx|xls|csv|txt)$/i.test(file.name)){st.textContent='Impossível carregar arquivo, verifique o formato.';return}
 let path=tipo==='atual'?caminhoAtualSeguro(p,file):p.history_path;
 const chave=normalizar(p.report_key),titulo=normalizar(p.report_title);
 if(tipo==='atual'&&((chave.includes('estudo')&&chave.includes('codigo'))||(titulo.includes('estudo')&&titulo.includes('codigo'))))path='atual/estudo codigo.xlsx';
 if(!path){st.textContent='Caminho não configurado.';return}
 if(tipo==='historico')path=String(path).replace(/\/$/,'')+'/'+new Date().toISOString().slice(0,10)+'_'+file.name;
 st.textContent='Enviando...';
 const up=await client().storage.from(BUCKET).upload(path,file,{upsert:true,cacheControl:'60'});
 if(up.error){st.textContent='Erro: '+up.error.message;return}
 await client().rpc('portal_log_upload_v2',{p_arquivo_codigo:p.report_key,p_bucket_id:BUCKET,p_caminho:path,p_tipo:tipo,p_nome_original:file.name,p_tamanho_bytes:file.size,p_resultado:'sucesso',p_mensagem:null});
 st.textContent='Arquivo enviado com sucesso.'
}

carregar();
