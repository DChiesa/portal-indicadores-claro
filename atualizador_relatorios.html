<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central de Atualização</title><script src="./portal-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--r:#e30613;--rd:#a6000d;--blue:#214f79;--blue2:#102847;--ink:#172033;--muted:#667085}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f3f5f8;color:var(--ink)}.top{height:59px;display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid #ddd;background:#fff}.back,.newtab{border:0;border-radius:11px;padding:10px 13px;font-weight:850;cursor:pointer}.back{background:#e9edf2}.newtab{margin-left:auto;background:#1479d7;color:#fff}.hero{background:linear-gradient(100deg,var(--rd),var(--r));color:#fff;padding:34px 24px;font-weight:900;font-size:24px}.wrap{max-width:1220px;margin:auto;padding:26px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:15px}.card{background:#fff;border:1px solid #d7deea;border-radius:16px;padding:16px;box-shadow:0 3px 12px #00000012}.title{font-weight:900;font-size:18px}.meta{margin-top:5px;color:var(--muted);font-size:12px}.small{font-size:12px;color:var(--muted)}input[type=file]{width:100%;margin:12px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 12px;font-weight:850;cursor:pointer}.btnAtual{background:var(--blue);color:#fff}.btnHist{background:var(--r);color:#fff}.btn:disabled{opacity:.35;cursor:not-allowed}.warn,.ok,.err{border-radius:13px;padding:15px 18px;margin-bottom:16px}.warn{background:#fff7e6;border:1px solid #ffd591;color:#7a4b00}.ok{background:#ecfdf3;border:1px solid #abefc6;color:#067647}.err{background:#fff1f3;border:1px solid #fecdd6;color:#b42318}</style></head><body><div class="top"><button class="back" onclick="location.href='index.html'">← Voltar ao portal</button><strong>Central de Atualização</strong><span id="topStatus">Carregando...</span><button class="newtab" onclick="window.open(location.href,'_blank','noopener')">Abrir em nova aba</button></div><div class="hero">Central de Atualização</div><main class="wrap"><div id="msg" class="warn">Carregando permissões...</div><div id="list" class="grid"></div></main><script>'use strict';const C=window.PORTAL_CONFIG;const BUCKET=C?.BUCKET||'bases-tecnico';const $=id=>document.getElementById(id);let sb=null;function client(){if(!sb)sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return sb}function setMsg(t,cls){$('msg').className=cls||'warn';$('msg').textContent=t}async function carregar(){try{const sess=(await client().auth.getSession()).data.session;if(!sess){location.href='index.html';return}const email=sess.user.email;const r=await client().rpc('portal_get_my_update_permissions_v2');$('topStatus').textContent='Carregado';if(r.error){setMsg('Erro ao carregar permissões: '+r.error.message,'err');return}const rows=r.data||[];if(!rows.length){setMsg('Seu login não possui relatórios liberados para atualização.','err');return}setMsg('Selecione o arquivo correto para cada relatório liberado.','ok');$('list').innerHTML='';rows.forEach(x=>$('list').appendChild(card(x)))}catch(e){setMsg(e.message||String(e),'err')}}function card(p){const div=document.createElement('div');div.className='card';div.innerHTML=`<div class="title">${p.report_title}</div><div class="meta">${p.category_key} • ${p.current_path||''}</div><div class="small">Atual: ${p.can_update_current?'liberado':'bloqueado'} | Histórico: ${p.can_update_history?'liberado':'bloqueado'}</div><input type="file" accept=".xlsx,.xls,.csv,.txt"><div class="actions"><button class="btn btnAtual" ${p.can_update_current?'':'disabled'}>Enviar Atual</button><button class="btn btnHist" ${p.can_update_history?'':'disabled'}>Enviar Histórico</button></div><div class="small status"></div>`;const inp=div.querySelector('input'),st=div.querySelector('.status');div.querySelector('.btnAtual').onclick=()=>upload(p,inp.files[0],'atual',st);div.querySelector('.btnHist').onclick=()=>upload(p,inp.files[0],'historico',st);return div}async function upload(p,file,tipo,st){if(!file){st.textContent='Selecione um arquivo primeiro.';return}let path=tipo==='atual'?p.current_path:p.history_path;if(!path){st.textContent='Caminho não configurado.';return}if(tipo==='atual'){const esperado=String(path).split('/').pop().toLowerCase();if(file.name.toLowerCase()!==esperado){st.textContent='Impossível carregar arquivo, verifique nome ou formato.';return}}else{path=String(path).replace(/\/$/,'')+'/'+new Date().toISOString().slice(0,10)+'_'+file.name}st.textContent='Enviando...';const up=await client().storage.from(BUCKET).upload(path,file,{upsert:true,cacheControl:'60'});if(up.error){st.textContent='Erro: '+up.error.message;return}await client().rpc('portal_log_upload_v2',{p_arquivo_codigo:p.report_key,p_bucket_id:BUCKET,p_caminho:path,p_tipo:tipo,p_nome_original:file.name,p_tamanho_bytes:file.size,p_resultado:'sucesso',p_mensagem:null});st.textContent='Arquivo enviado com sucesso.'}carregar();</script></body></html>
