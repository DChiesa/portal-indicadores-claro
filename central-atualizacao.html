<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Central de Atualização</title>
  <style>
    :root{--claro-red:#e30613;--navy:#061126;--blue:#17466f;--line:#d7deea;--muted:#667085}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#111}
    header{background:var(--claro-red);color:#fff;padding:16px 22px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
    main{max-width:1050px;margin:24px auto;padding:0 16px}
    .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
    .card{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}
    .title{font-weight:900;font-size:18px;margin-bottom:4px}.meta{color:var(--muted);font-size:12px;margin-bottom:12px}
    .actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer}.btn-current{background:var(--blue);color:#fff}.btn-history{background:var(--claro-red);color:#fff}.btn:disabled{opacity:.35;cursor:not-allowed}
    input[type=file]{display:block;margin:10px 0;max-width:100%}.warn{background:#fff7e6;border:1px solid #ffd591;color:#7a4b00;border-radius:12px;padding:12px;margin-bottom:14px}.ok{background:#ecfdf3;border:1px solid #abefc6;color:#067647;border-radius:12px;padding:12px;margin-bottom:14px}.err{background:#fff1f3;border:1px solid #fecdd6;color:#b42318;border-radius:12px;padding:12px;margin-bottom:14px}.small{font-size:12px;color:var(--muted)}
  </style>
  <script src="./portal-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<!-- ALTERACAO: visual aprovado da terceira imagem; funcionalidade preservada -->
<link rel="stylesheet" href="assets/claro-visual-aprovado.css">
</head>
<body>
<header>
  <div>Central de Atualização</div>
  <button onclick="history.back()" style="border:0;border-radius:10px;padding:9px 12px;font-weight:800;">Voltar</button>
</header>
<main>
  <div id="msg" class="warn">Carregando permissões...</div>
  <div id="list" class="grid"></div>
</main>
<script>
/* IMPORTANTE: se seu index ja carrega o Supabase global em outro arquivo, inclua esse mesmo arquivo antes desta pagina.
   Esta pagina espera window.supabase ja inicializado. */
(function(){
  const DEMETRIUS = ['demetrius377','demetrius377@claro.com.br','demetrius377@gmail.com'];
  const BUCKET = 'bases-tecnico';
  const msg = document.getElementById('msg');
  const list = document.getElementById('list');
  const norm = v => String(v||'').trim().toLowerCase();
  const isDemetrius = e => DEMETRIUS.some(x => norm(e) === norm(x) || norm(e).includes(norm(x)));
  function setMsg(t,cls){ msg.className=cls||'warn'; msg.textContent=t; }
  async function recuperarSessaoDoPortal(){
    let s=(await supabaseClient.auth.getSession()).data.session;
    if(s||window.parent===window)return s;
    return await new Promise(resolve=>{
      let finalizado=false;
      const concluir=v=>{if(finalizado)return;finalizado=true;clearTimeout(timer);window.removeEventListener('message',receber);resolve(v)};
      const receber=async e=>{if(e.origin!==location.origin||e.source!==window.parent||e.data?.type!=='PORTAL_SESSION_RESPONSE')return;try{const r=await supabaseClient.auth.setSession({access_token:e.data.access_token,refresh_token:e.data.refresh_token});concluir(r.data.session||null)}catch(_){concluir(null)}};
      window.addEventListener('message',receber);
      const timer=setTimeout(()=>concluir(null),2500);
      window.parent.postMessage({type:'PORTAL_SESSION_REQUEST'},location.origin);
    });
  }
  async function emailAtual(){
    try{const s=await recuperarSessaoDoPortal();return s?.user?.email||'';}catch(e){return '';}
  }
  async function carregar(){
    if(!window.supabase){ setMsg('Supabase não encontrado nesta página. Inclua aqui o mesmo script/configuração Supabase usado no index.html.','err'); return; }
    const email = await emailAtual();
    if(!email){ setMsg('Usuário não identificado. Faça login novamente.','err'); return; }
    let {data,error} = await supabaseClient.rpc('portal_get_update_permissions',{p_email:email});
    if(error){ setMsg('Erro ao carregar permissões: '+error.message,'err'); return; }
    data = data || [];
    if(!data.length && !isDemetrius(email)){ setMsg('Seu login não possui relatórios liberados para atualização.','err'); return; }
    setMsg('Selecione o arquivo conforme o relatório liberado para seu login.','ok');
    list.innerHTML = '';
    data.forEach(p => list.appendChild(criarCard(p)));
  }
  function criarCard(p){
    const div = document.createElement('div'); div.className='card';
    div.innerHTML = `<div class="title">${p.report_title}</div><div class="meta">${p.category_key} • ${p.current_path || ''}</div><div class="small">Atual: ${p.can_update_current?'liberado':'bloqueado'} | Histórico: ${p.can_update_history?'liberado':'bloqueado'}</div><input type="file" accept=".xlsx,.xls,.csv" /><div class="actions"><button class="btn btn-current" ${p.can_update_current?'':'disabled'}>Enviar Atual</button><button class="btn btn-history" ${p.can_update_history?'':'disabled'}>Enviar Histórico</button></div><div class="small status"></div>`;
    const input = div.querySelector('input'); const status=div.querySelector('.status');
    div.querySelector('.btn-current').onclick = () => upload(p,input.files[0],'current',status);
    div.querySelector('.btn-history').onclick = () => upload(p,input.files[0],'history',status);
    return div;
  }
  async function upload(p,file,tipo,status){
    if(!file){ status.textContent='Selecione um arquivo primeiro.'; return; }
    const destinoBase = tipo === 'current' ? p.current_path : p.history_path;
    if(!destinoBase){ status.textContent='Caminho de destino não configurado.'; return; }
    let path = destinoBase;
    if(tipo === 'history'){
      const stamp = new Date().toISOString().slice(0,10);
      path = destinoBase.replace(/\/$/,'') + '/' + stamp + '_' + file.name;
    }
    if(tipo === 'current' && file.name.toLowerCase() !== String(destinoBase).split('/').pop().toLowerCase()){
      status.textContent='Impossível carregar arquivo, verifique nome ou formato.';
      return;
    }
    status.textContent='Enviando...';
    const {error} = await supabaseClient.storage.from(BUCKET).upload(path,file,{upsert:true,cacheControl:'60'});
    status.textContent = error ? ('Erro: '+error.message) : 'Arquivo enviado com sucesso.';
  }
  carregar();
})();
</script>
<script src="assets/claro-visual-aprovado.js"></script>
</body>
</html>
