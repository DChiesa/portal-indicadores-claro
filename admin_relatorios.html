</head><body><div class="top"><button class="back" onclick="location.href='index.html'">← Voltar ao portal</button><h2>Gerenciar Relatórios</h2></div><main class="wrap"><div class="box"><p><b>Somente Demétrius pode usar esta página.</b></p><div class="row"><div><label>Nome do relatório</label><input id="nome" placeholder="Ex.: Novo Painel"></div><div><label>Categoria</label><select id="categoria"><option value="manutencao">Manutenção</option><option value="instalacao">Instalação</option><option value="rede">Rede</option><option value="backbone">Backbone</option><option value="tecnico">Técnico</option><option value="administracao">Administração</option></select></div></div><label>Arquivo HTML</label><input id="file" type="file" accept=".html"><label class="update-control"><input id="permiteAtualizacao" type="checkbox"> Este relatório usa base no Supabase e deve aparecer na Central de Atualização</label><button class="btn" onclick="enviar()">Enviar novo relatório</button><div id="msg"></div></div><div class="box"><h3>Relatórios cadastrados</h3><div id="list" class="list">Carregando...</div></div></main><script>'use strict';const C=window.PORTAL_CONFIG,$=id=>document.getElementById(id);let sb=null;function client(){if(!sb)sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return sb}function msg(t,ok=true){$('msg').className='msg '+(ok?'ok':'err');$('msg').textContent=t}function slug(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')}async function checkAdmin(){const s=(await client().auth.getSession()).data.session;if(!s){location.href='index.html';return false}if(!String(s.user.email||'').toLowerCase().includes('demetrius377')){document.body.innerHTML='<div style="padding:30px;font-family:Segoe UI">Somente Demétrius pode usar esta página.</div>';return false}return true}async function carregar(){if(!await checkAdmin())return;const r=await client().rpc('portal_admin_list_reports');if(r.error){$('list').textContent='Erro: '+r.error.message;return}const ctl=await client().rpc('portal_admin_list_report_controls');const mapa=new Map((ctl.data||[]).map(x=>[String(x.report_key),x]));const rows=(r.data||[]).filter(x=>x.ativo!==false);$('list').innerHTML=rows.length?rows.map(x=>{const c=mapa.get(String(x.codigo))||{};return `<div class="item"><div><b>${x.nome}</b><small>${x.categoria||''} • ${x.arquivo||''}</small><label class="update-control"><input type="checkbox" ${c.allow_update?'checked':''} onchange="definirAtualizacao('${x.codigo}',this.checked)"> Exibir na Central de Atualização</label></div><button class="btn del xbtn" title="Retirar este relatório" aria-label="Retirar este relatório" onclick="remover('${x.codigo}')">×</button></div>`}).join(''):'Nenhum relatório cadastrado.'}async function enviar(){const f=$('file').files[0];if(!f){msg('Selecione um arquivo HTML.',false);return}if(!/\.html?$/i.test(f.name)){msg('Impossível carregar arquivo, verifique nome ou formato.',false);return}const nome=$('nome').value.trim()||f.name.replace(/\.html?$/i,''),codigo=slug(nome),githubPath=codigo+'.html',storagePath='reports/'+githubPath;if(!codigo){msg('Informe um nome válido.',false);return}msg('Validando e enviando...');try{const text=await f.text();if(!/<html/i.test(text)||!/<body/i.test(text)||!/<\/html>/i.test(text))throw Error('HTML incompleto ou inválido.');const blob=new Blob([text],{type:'text/html;charset=utf-8'});const up=await client().storage.from(C.REPORTS_BUCKET||'portal-html').upload(storagePath,blob,{upsert:true,contentType:'text/html;charset=utf-8',cacheControl:'60'});if(up.error)throw Error('Supabase: '+up.error.message);const sync=await client().functions.invoke(C.GITHUB_SYNC_FUNCTION||'github-report-sync',{body:{storagePath,githubPath}});if(sync.error)throw Error('GitHub: '+sync.error.message);if(!sync.data||!sync.data.ok)throw Error('GitHub: '+((sync.data&&sync.data.error)||'sincronização não confirmada'));const r=await client().rpc('portal_admin_save_report',{p_codigo:codigo,p_nome:nome,p_categoria:$('categoria').value,p_arquivo:githubPath,p_storage_path:storagePath});if(r.error)throw Error('Cadastro: '+r.error.message);const c=await client().rpc('portal_admin_set_report_control',{p_report_key:codigo,p_visible:true,p_allow_update:$('permiteAtualizacao').checked});if(c.error)throw Error('Controle: '+c.error.message);msg('Concluído. Supabase: '+storagePath+' | GitHub: '+githubPath);$('nome').value='';$('file').value='';$('permiteAtualizacao').checked=false;await carregar()}catch(e){msg(e.message,false)}}async function definirAtualizacao(codigo,valor){const r=await client().rpc('portal_admin_set_report_control',{p_report_key:codigo,p_visible:true,p_allow_update:!!valor});if(r.error){msg('Erro ao alterar atualização: '+r.error.message,false);await carregar();return}msg(valor?'Relatório liberado para atualização.':'Relatório retirado da Central de Atualização.')}async function remover(codigo){if(!confirm('Retirar este relatório do portal, do gerenciamento e da Central de Atualização?'))return;const c=await client().rpc('portal_admin_set_report_control',{p_report_key:codigo,p_visible:false,p_allow_update:false});if(c.error){msg('Erro ao retirar da Central: '+c.error.message,false);return}const r=await client().rpc('portal_admin_disable_report',{p_codigo:codigo});if(r.error){msg('Erro ao retirar: '+r.error.message,false);return}msg('Relatório retirado do portal.');await carregar()}carregar();</script><script id="CLARO_VISUAL_FINAL_V2_JS">/* CLARO_VISUAL_FINAL_V2: move os elementos originais; não clona IDs nem eventos */

function t(e){return(e&&e.textContent||'').replace(/\s+/g,' ').trim()}function one(a){for(var i=0;i<(a||[]).length;i++){var e=document.querySelector(a[i]);if(e)return e}return null}
function title(){var e=document.querySelector('h1,h2,.title,.brand');return(t(e)||document.title||'Relatório').replace(/^CLARO\s*\|?\s*/i,'').trim()}function sub(){var a=document.querySelectorAll('h1+p,h2+p,.sub,.subtitle');for(var i=0;i<a.length;i++){var x=t(a[i]);if(x&&x.length<130)return x}return''}
function back(){try{if(parent!==window&&parent.document){var b=parent.document.getElementById('back');if(b){b.click();return}}}catch(e){}location.href='index.html'}
function build(){if(document.getElementById('clvHeader'))return;var h=document.createElement('header');h.id='clvHeader';h.innerHTML='<div class="clv-main"><div class="clv-logo">Clar<span class="clv-o">o<i class="clv-ray r1"></i><i class="clv-ray r2"></i><i class="clv-ray r3"></i></span></div><div><div class="clv-welcome">Bem-vindo, <b>DEMETRIUS ROGINA CHIESA FREITAS</b></div><div class="clv-meta"><span>● Login: <b>demetrius.chiesa</b></span><span>▣ Atual até: <b>06/08/2026</b></span><span>◇ Certificado de propriedade: <b>Demétrius Chiesa</b></span></div></div><div class="clv-service"><div class="clv-service-text"><small>SERVIÇOS</small>TÉCNICOS</div><div class="clv-tech"><div class="clv-brain"></div><i class="clv-gear g1">⚙</i><i class="clv-gear g2">⚙</i><div class="clv-bulb"></div><span class="clv-bi">BI</span><span class="clv-lines"></span></div></div></div><div id="clvFilters" class="clv-filter-area"></div><div class="clv-titlebar"><button class="clv-back" type="button">← Voltar ao portal</button><div class="clv-copy"><span class="clv-title"></span><span class="clv-sub"></span></div><button class="clv-new" type="button">↗ Abrir em nova aba</button></div>';h.querySelector('.clv-title').textContent=title();h.querySelector('.clv-sub').textContent=sub();h.querySelector('.clv-back').onclick=back;h.querySelector('.clv-new').onclick=function(){window.open(location.href,'_blank','noopener')};document.body.prepend(h);
var f=one(filters[pg]);if(f){f.classList.add('clv-filters');h.querySelector('#clvFilters').appendChild(f)}
(oldheads[pg]||[]).forEach(function(s){document.querySelectorAll(s).forEach(function(e){if(!e.closest('#clvHeader'))e.classList.add('clv-old-head')})});
