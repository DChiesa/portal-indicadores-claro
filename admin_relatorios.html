<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciar Relatorios</title><script src="./portal-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--r:#e30613;--i:#172033;--m:#667085;--l:#d8dee8}*{box-sizing:border-box}body{margin:0;background:#f3f5f8;font-family:Segoe UI,Arial;color:var(--i)}header{padding:17px 22px;background:linear-gradient(110deg,#a7000c,var(--r));color:#fff;display:flex;align-items:center}header h1{margin:0}.back{margin-left:auto;border:0;border-radius:10px;padding:10px 13px;background:#fff;color:var(--r);font-weight:900}.wrap{max-width:1150px;margin:24px auto;padding:0 15px}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.field label{display:block;font-size:11px;font-weight:900;color:var(--m);margin-bottom:5px}.field input,.field select{width:100%;height:42px;border:1px solid #aeb9c8;border-radius:10px;padding:0 10px;background:#fff}.wide{grid-column:1/-1}.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--r);color:#fff;font-weight:900;cursor:pointer}.soft{background:#e9edf2;color:var(--i)}.msg{display:none;margin-top:12px;padding:11px;border-radius:10px}.ok{display:block;background:#e9f8ef;color:#137a3b}.err{display:block;background:#fff0f0;color:#b42318}.list{display:grid;gap:8px}.item{display:grid;grid-template-columns:1fr auto;gap:10px;border:1px solid var(--l);border-radius:10px;padding:11px}.item small{display:block;color:var(--m);margin-top:3px}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header><h1>Gerenciar Relatorios e Categorias</h1><button class="back" onclick="location.href='index.html'">Voltar ao portal</button></header><main class="wrap"><section class="card"><h2>Novo relatorio / editar relatorio</h2><div class="grid"><input id="id" type="hidden"><div class="field"><label>NOME DO RELATORIO</label><input id="nome" required></div><div class="field"><label>CODIGO</label><input id="codigo" placeholder="ex: qualidade_instalacao"></div><div class="field"><label>CATEGORIA</label><select id="categoria"></select></div><div class="field"><label>TEXTO DA MINIATURA</label><input id="miniatura" maxlength="20" placeholder="ex: INSTALACAO"></div><div class="field wide"><label>DESCRICAO CURTA</label><input id="descricao" maxlength="100"></div><div class="field"><label>ORDEM</label><input id="ordem" type="number" value="100"></div><div class="field"><label>ATIVO</label><select id="ativo"><option value="true">Sim</option><option value="false">Nao</option></select></div><div class="field wide"><label>ARQUIVO HTML NOVO</label><input id="html" type="file" accept=".html,text/html"></div></div><p><b>Regra:</b> para relatório novo, selecione um HTML. Para apenas mudar a categoria de relatório existente, clique em Editar e não selecione arquivo.</p><button id="salvar" class="btn">Salvar e integrar ao portal</button><button id="limpar" class="btn soft">Limpar</button><div id="msg" class="msg"></div></section><section class="card"><h2>Relatorios cadastrados</h2><div id="lista" class="list"></div></section></main><script>
'use strict';const $=x=>document.getElementById(x),C=window.PORTAL_CONFIG;let sb,rows=[];const cats=[['manutencao','Manutencao'],['instalacao','Instalacao'],['rede','Rede'],['headend','Headend'],['backbone','Backbone'],['filtro','Filtro'],['tecnico','Tecnico']];function say(t,k){$('msg').className='msg '+k;$('msg').textContent=t}function clear(){['id','nome','codigo','miniatura','descricao'].forEach(x=>$(x).value='');$('categoria').value='manutencao';$('ordem').value=100;$('ativo').value='true';$('html').value=''}async function load(){const r=await sb.rpc('admin_listar_relatorios');if(r.error){say(r.error.message,'err');return}rows=r.data||[];$('lista').innerHTML=rows.map(x=>`<div class="item"><span><b>${x.nome}</b><small>${x.categoria} | ${x.arquivo} | ${x.origem||'github'}</small></span><button class="btn soft" data-edit="${x.id}">Editar</button></div>`).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(+b.dataset.edit))}function edit(id){const x=rows.find(r=>r.id===id);$('id').value=x.id;$('nome').value=x.nome;$('codigo').value=x.codigo;$('categoria').value=x.categoria||'manutencao';$('miniatura').value=x.miniatura||'';$('descricao').value=x.descricao||'';$('ordem').value=x.ordem||100;$('ativo').value=String(x.ativo);$('html').value='';scrollTo({top:0,behavior:'smooth'})}
$('salvar').onclick=async()=>{try{const id=$('id').value?+$('id').value:null,file=$('html').files[0],existing=id?rows.find(x=>x.id===id):null;if(!$('nome').value.trim()||!$('codigo').value.trim())throw Error('Preencha nome e codigo.');if(!id&&!file)throw Error('Selecione o arquivo HTML do novo relatorio.');let origem=existing?.origem||'github',storagePath=existing?.storage_path||null,arquivo=existing?.arquivo||'';if(file){if(!file.name.toLowerCase().endsWith('.html'))throw Error('O arquivo deve estar no formato HTML.');storagePath='relatorios/'+$('codigo').value.trim().toLowerCase().replace(/[^a-z0-9_]+/g,'_')+'.html';const up=await sb.storage.from('portal-html').upload(storagePath,file,{upsert:true,contentType:'text/html',cacheControl:'0'});if(up.error)throw up.error;origem='storage';arquivo='visualizador_relatorio.html'}const r=await sb.rpc('admin_salvar_relatorio',{p_id:id,p_codigo:$('codigo').value.trim(),p_nome:$('nome').value.trim(),p_arquivo:arquivo,p_categoria:$('categoria').value,p_ativo:$('ativo').value==='true',p_origem:origem,p_storage_path:storagePath,p_miniatura:$('miniatura').value.trim()||$('categoria').value.toUpperCase(),p_descricao:$('descricao').value.trim(),p_ordem:+$('ordem').value||100});if(r.error)throw r.error;const savedId=r.data;if(origem==='storage'){const rr=await sb.rpc('admin_salvar_relatorio',{p_id:savedId,p_codigo:$('codigo').value.trim(),p_nome:$('nome').value.trim(),p_arquivo:'visualizador_relatorio.html?id='+savedId,p_categoria:$('categoria').value,p_ativo:$('ativo').value==='true',p_origem:origem,p_storage_path:storagePath,p_miniatura:$('miniatura').value.trim()||$('categoria').value.toUpperCase(),p_descricao:$('descricao').value.trim(),p_ordem:+$('ordem').value||100});if(rr.error)throw rr.error}say('Relatorio salvo e integrado ao portal.','ok');clear();await load()}catch(e){say(e.message,'err')}};$('limpar').onclick=clear;
async function init(){$('categoria').innerHTML=cats.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const s=await sb.auth.getSession();if(!s.data.session){location.href='index.html';return}const a=await sb.rpc('eh_admin_portal',{p_user:s.data.session.user.id});if(a.data!==true){document.body.innerHTML='<h2>Acesso negado</h2>';return}await load()}init();
</script></body></html>
