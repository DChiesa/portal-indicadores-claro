<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Gerenciar Relatórios</title>

  <script src="./portal-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    :root {
      --r: #e30613;
      --blue: #214f79;
      --ink: #172033;
      --muted: #667085;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Segoe UI, Arial, sans-serif;
      background: #f4f7fb;
      color: var(--ink);
    }

    .top {
      display: flex;
      gap: 12px;
      align-items: center;
      background: #fff;
      border-bottom: 1px solid #dde5ef;
      padding: 12px 18px;
    }

    .back {
      border: 0;
      border-radius: 11px;
      background: #e9edf2;
      padding: 10px 14px;
      font-weight: 900;
    }

    .wrap {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 14px;
    }

    .box {
      background: #fff;
      border: 1px solid #d7deea;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 14px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      font-size: 12px;
      font-weight: 900;
      color: #26385d;
      display: block;
      margin: 9px 0 6px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #b8c6d8;
      border-radius: 10px;
      background: #fff;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      background: var(--r);
      color: #fff;
      padding: 12px 18px;
      font-weight: 900;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: space-between;
      border: 1px solid #d7deea;
      border-radius: 12px;
      padding: 12px;
      background: #fbfcfe;
    }

    .item small {
      display: block;
      color: #667085;
    }

    .del {
      background: #444;
    }

    .update-control {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 12px;
      font-weight: 800;
    }

    .update-control input {
      width: auto;
    }

    .xbtn {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 50%;
      font-size: 18px;
    }

    .msg {
      margin-top: 12px;
      border-radius: 10px;
      padding: 12px;
    }

    .ok {
      background: #e7f8ed;
      color: #075b28;
    }

    .err {
      background: #ffe8e8;
      color: #9f0000;
    }

    @media (max-width: 760px) {
      .row {
        grid-template-columns: 1fr;
      }

      .item {
        display: block;
      }

      .item button {
        margin-top: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="top">
    <h2>Gerenciar Relatórios</h2>
  </div>

  <main class="wrap">
    <div class="box">
      <p>
        <b>Somente Demétrius pode usar esta página.</b>
      </p>

      <div class="row">
        <div>
          <label for="nome">Nome do relatório</label>
          <input
            id="nome"
            placeholder="Ex.: Novo Painel"
          >
        </div>

        <div>
          <label for="categoria">Categoria</label>

          <select id="categoria">
            <option value="manutencao">Manutenção</option>
            <option value="instalacao">Instalação</option>
            <option value="rede">Rede</option>
            <option value="backbone">Backbone</option>
            <option value="tecnico">Técnico</option>
            <option value="administracao">Administração</option>
          </select>
        </div>
      </div>

      <label for="file">Arquivo HTML</label>

      <input
        id="file"
        type="file"
        accept=".html"
      >

      <label class="update-control">
        <input
          id="permiteAtualizacao"
          type="checkbox"
        >

        Este relatório usa base no Supabase e deve aparecer na Central de Atualização
      </label>

      <button
        class="btn"
        type="button"
        onclick="enviar()"
      >
        Enviar novo relatório
      </button>

      <div id="msg"></div>
    </div>

    <div class="box">
      <h3>Relatórios cadastrados</h3>

      <div id="list" class="list">
        Carregando...
      </div>
    </div>
  </main>

  <script>
    'use strict';

    const C = window.PORTAL_CONFIG;
    const $ = id => document.getElementById(id);

    let sb = null;

    function client() {
      if (!sb) {
        sb = supabase.createClient(
          C.SUPABASE_URL,
          C.SUPABASE_PUBLISHABLE_KEY,
          {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: true
            }
          }
        );
      }

      return sb;
    }

    function msg(t, ok = true) {
      $('msg').className = 'msg ' + (ok ? 'ok' : 'err');
      $('msg').textContent = t;
    }

    function slug(s) {
      return String(s || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
