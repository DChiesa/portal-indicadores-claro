<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciar Relatórios</title><script src="./portal-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--r:#e30613;--blue:#214f79;--ink:#172033;--muted:#667085}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f7fb;color:var(--ink)}.top{display:flex;gap:12px;align-items:center;background:#fff;border-bottom:1px solid #dde5ef;padding:12px 18px}.back{border:0;border-radius:11px;background:#e9edf2;padding:10px 14px;font-weight:900}.wrap{max-width:1100px;margin:20px auto;padding:0 14px}.box{background:#fff;border:1px solid #d7deea;border-radius:16px;padding:15px;margin-bottom:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;font-weight:900;color:#26385d;display:block;margin:9px 0 6px}input,select{width:100%;padding:12px;border:1px solid #b8c6d8;border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;background:var(--r);color:#fff;padding:12px 18px;font-weight:900}.list{display:grid;gap:10px}.item{display:flex;align-items:center;gap:12px;justify-content:space-between;border:1px solid #d7deea;border-radius:12px;padding:12px;background:#fbfcfe}.item small{display:block;color:#667085}.del{background:#444}.msg{margin-top:12px;border-radius:10px;padding:12px}.ok{background:#e7f8ed;color:#075b28}.err{background:#ffe8e8;color:#9f0000}@media(max-width:760px){.row{grid-template-columns:1fr}.item{display:block}.item button{margin-top:10px}}</style></head><body><div class="top"><button class="back" onclick="location.href='index.html'">← Voltar ao portal</button><h2>Gerenciar Relatórios</h2></div><main class="wrap"><div class="box"><p><b>Somente Demétrius pode usar esta página.</b></p><div class="row"><div><label>Nome do relatório</label><input id="nome" placeholder="Ex.: Novo Painel"></div><div><label>Categoria</label><select id="categoria"><option value="manutencao">Manutenção</option><option value="instalacao">Instalação</option><option value="rede">Rede</option><option value="backbone">Backbone</option><option value="tecnico">Técnico</option></select></div></div><label>Arquivo HTML</label><input id="file" type="file" accept=".html"><button class="btn" onclick="enviar()">Enviar novo relatório</button><div id="msg"></div></div><div class="box"><h3>Relatórios cadastrados</h3><div id="list" class="list">Carregando...</div></div></main><script>'use strict';const C=window.PORTAL_CONFIG,$=id=>document.getElementById(id);let sb=null;function client(){if(!sb)sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return sb}function msg(t,ok=true){$('msg').className='msg '+(ok?'ok':'err');$('msg').textContent=t}function slug(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')}async function checkAdmin(){const s=(await client().auth.getSession()).data.session;if(!s){location.href='index.html';return false}if(!String(s.user.email||'').toLowerCase().includes('demetrius377')){document.body.innerHTML='<div style="padding:30px;font-family:Segoe UI">Somente Demétrius pode usar esta página.</div>';return false}return true}async function carregar(){if(!await checkAdmin())return;const r=await client().rpc('portal_admin_list_reports');if(r.error){$('list').textContent='Erro: '+r.error.message;return}const rows=r.data||[];$('list').innerHTML=rows.length?rows.map(x=>`<div class="item"><div><b>${x.nome}</b><small>${x.categoria||''} • ${x.arquivo||''} • ${x.ativo===false?'inativo':'ativo'}</small></div><button class="btn del" onclick="remover('${x.codigo}')">Retirar</button></div>`).join(''):'Nenhum relatório cadastrado.'}async function enviar(){const f=$('file').files[0];if(!f){msg('Selecione um arquivo HTML.',false);return}const nome=$('nome').value.trim()||f.name.replace(/\.html?$/i,'');const codigo=slug(nome);const storagePath=codigo+'_'+Date.now()+'.html';msg('Enviando...');let up=await client().storage.from('portal-html').upload(storagePath,f,{upsert:true,contentType:'text/html'});if(up.error){msg('Erro no upload: '+up.error.message,false);return}let r=await client().rpc('portal_admin_save_report',{p_codigo:codigo,p_nome:nome,p_categoria:$('categoria').value,p_arquivo:'visualizador_relatorio.html?id=',p_storage_path:storagePath});if(r.error){msg('Upload feito, mas erro ao cadastrar: '+r.error.message,false);return}msg('Relatório enviado com sucesso.');$('nome').value='';$('file').value='';await carregar()}async function remover(codigo){if(!confirm('Retirar este relatório do portal?'))return;const r=await client().rpc('portal_admin_disable_report',{p_codigo:codigo});if(r.error){msg('Erro ao retirar: '+r.error.message,false);return}msg('Relatório retirado do portal.');await carregar()}carregar();</script></body></html>
